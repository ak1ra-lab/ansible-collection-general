---
# https://cloud.google.com/sdk/docs/install?hl=zh-cn#deb
- name: ak1ra_lab.general.apt_install - gcloud
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: true
  vars:
    # curl -sL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg
    # pub   rsa2048 2021-05-04 [SC]
    #       35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3
    # uid           Artifact Registry Repository Signer <artifact-registry-repository-signer@google.com>
    apt_install_keyrings_url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    apt_install_keyrings_dest: /etc/apt/keyrings/gcloud.asc

    apt_install_repo: gcloud
    apt_install_repo_uris:
      - https://packages.cloud.google.com/apt
    apt_install_repo_suites:
      - cloud-sdk
    apt_install_repo_components:
      - main

    apt_install_pinning: true
    apt_install_unattended_upgrade: true
    apt_install_mark_hold: false
    apt_install_pinning_pin_release: "o=cloud-sdk,n=cloud-sdk,c=main"
    apt_install_unattended_upgrade_origins_pattern: "origin=cloud-sdk,codename=cloud-sdk,component=main"

    apt_install_repo_packages:
      - google-cloud-cli

  tasks:
    - name: apply ak1ra_lab.general.apt_install role
      ansible.builtin.import_role:
        name: ak1ra_lab.general.apt_install
