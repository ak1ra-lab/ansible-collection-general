---
# https://debian.griffo.io/
- name: ak1ra_lab.general.apt_install - debian.griffo.io
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: true
  vars:
    # $ curl -sL https://debian.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc | gpg
    # pub   ed25519 2025-02-24 [SC]
    #       EA0F721D231FDD3A0A17B9AC7808B4DD62C41256
    # uid           Dario Griffo <dariogriffo@gmail.com>
    # sub   cv25519 2025-02-24 [E]
    apt_install_keyrings_url: https://debian.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc
    apt_install_keyrings_dest: /etc/apt/keyrings/debian.griffo.io.asc

    apt_install_repo: debian-griffo-io
    apt_install_repo_uris:
      - https://debian.griffo.io/apt
    apt_install_repo_suites:
      - "{{ ansible_facts['distribution_release'] }}"
    apt_install_repo_components:
      - main

    apt_install_pinning: true
    apt_install_unattended_upgrade: true
    apt_install_mark_hold: false

    # Suite: trixie
    # Codename: trixie
    # Date: Sat, 28 Feb 2026 10:43:21 UTC
    # Architectures: amd64 arm64 i386 armel armhf ppc64el s390x riscv64
    # Components: main
    # Description: Apt repository for several unofficial packages
    # apt_install_pinning_pin_release: ""
    # apt_install_unattended_upgrade_origins_pattern: ""

    apt_install_repo_packages: []

  tasks:
    - name: apply ak1ra_lab.general.apt_install role
      ansible.builtin.import_role:
        name: ak1ra_lab.general.apt_install
