---
# https://pkgs.tailscale.com/stable/#debian-bookworm
- name: ak1ra_lab.general.apt_install - tailscale
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: true
  vars:
    # curl -sL https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg | gpg
    # pub   rsa4096 2020-02-25 [SC]
    #       2596A99EAAB33821893C0A79458CA832957F5868
    # uid           Tailscale Inc. (Package repository signing key) <info@tailscale.com>
    # sub   rsa4096 2020-02-25 [E]
    # 虽然 tailscale 不同 codename 使用了不同的 apt keyring url, 但是 fingerprint 都是一样的?
    apt_install_keyrings_url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    apt_install_keyrings_dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg

    apt_install_repo: tailscale
    apt_install_repo_uris:
      - https://pkgs.tailscale.com/stable/debian
    apt_install_repo_suites:
      - "{{ ansible_facts['distribution_release'] }}"
    apt_install_repo_components:
      - main

    apt_install_pinning: true
    apt_install_unattended_upgrade: true
    apt_install_mark_hold: false

    apt_install_repo_packages:
      - tailscale

  tasks:
    - name: apply ak1ra_lab.general.apt_install role
      ansible.builtin.import_role:
        name: ak1ra_lab.general.apt_install
