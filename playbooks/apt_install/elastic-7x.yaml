---
# https://www.elastic.co/docs/reference/beats/filebeat/setup-repositories
# We use the Elasticsearch signing key [D88E42B4]
# (https://pgp.mit.edu/pks/lookup?op=vindex&search=0xD27D666CD88E42B4).
# Fingerprint: 4609 5ACC 8548 582C 1A26 99A9 D27D 666C D88E 42B4
- name: ak1ra_lab.general.apt_install - elastic-7x
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: true
  vars:
    # curl -sL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg
    # pub   rsa2048 2013-09-16 [SC]
    #       46095ACC8548582C1A2699A9D27D666CD88E42B4
    # uid           Elasticsearch (Elasticsearch Signing Key) <dev_ops@elasticsearch.org>
    # sub   rsa2048 2013-09-16 [E]
    apt_install_keyrings_url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    apt_install_keyrings_dest: /etc/apt/keyrings/elasticsearch-keyring.asc

    apt_install_repo: elastic-7x
    apt_install_repo_uris:
      - https://artifacts.elastic.co/packages/7.x/apt
    apt_install_repo_suites:
      - stable
    apt_install_repo_components:
      - main

    apt_install_pinning: true
    apt_install_unattended_upgrade: false
    apt_install_mark_hold: false
    apt_install_pinning_pin_release: "o=elastic,n=stable,c=main"
    apt_install_unattended_upgrade_origins_pattern: "origin=elastic,codename=stable,component=main"

    # elasticsearch, logstash, kibana, filebeat
    apt_install_repo_packages: []

  tasks:
    - name: apply ak1ra_lab.general.apt_install role
      ansible.builtin.import_role:
        name: ak1ra_lab.general.apt_install
