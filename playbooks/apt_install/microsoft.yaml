---
# https://learn.microsoft.com/en-us/linux/packages
- name: ak1ra_lab.general.apt_install - microsoft
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: true
  vars:
    # https://packages.microsoft.com/keys/README
    # microsoft.asc (BC528686B50D79E339D3721CEB3E94ADBE1229CF):
    # This key was Microsoft's standard Linux-signing key until Spring 2025.
    # It will not be used for newly-created repositories.
    # microsoft-2025.asc (AA86F75E427A19DD33346403EE4D7792F748182B):
    # This is the current standard Linux-signing key for new repositories.
    # It works in distributions that disallow SHA1 signatures.

    # 2025-06-30: Debian 12 (bookworm) 仍在使用 microsoft.asc
    # 2025-08-11: Debian 13 (trixie) 已切换至 microsoft-2025.asc
    # curl -sL https://packages.microsoft.com/keys/microsoft.asc | gpg
    # pub   rsa2048 2015-10-28 [SC]
    #       BC528686B50D79E339D3721CEB3E94ADBE1229CF
    # uid           Microsoft (Release signing) <gpgsecurity@microsoft.com>
    # $ curl -sL https://packages.microsoft.com/keys/microsoft-2025.asc | gpg
    # pub   rsa4096 2023-11-15 [SC]
    #       AA86F75E427A19DD33346403EE4D7792F748182B
    # uid           Microsoft Corporation - General GPG Signer <gpgsign@microsoft.com>
    apt_install_keyrings:
      bookworm:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
      trixie:
        url: https://packages.microsoft.com/keys/microsoft-2025.asc
        dest: /etc/apt/keyrings/microsoft-2025.asc

    apt_install_keyrings_url: "{{ apt_install_keyrings[ansible_facts['distribution_release']].url }}"
    apt_install_keyrings_dest: "{{ apt_install_keyrings[ansible_facts['distribution_release']].dest }}"

    apt_install_repo: microsoft
    # https://packages.microsoft.com/debian/12/prod/
    # 尽量避免使用 ansible_lsb, 它依赖 lsb_release, 在一些精简系统中可能缺失相关字段
    apt_install_repo_uris:
      - "https://packages.microsoft.com/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_major_version'] }}/prod"
    apt_install_repo_suites:
      - "{{ ansible_facts['distribution_release'] }}"
    apt_install_repo_components:
      - main

    apt_install_pinning: true
    apt_install_unattended_upgrade: true
    apt_install_mark_hold: false

    # dotnet-sdk, moby-containerd, msopenjdk-21, mssql-tools, powershell
    apt_install_repo_packages: []

  tasks:
    - name: apply ak1ra_lab.general.apt_install role
      ansible.builtin.import_role:
        name: ak1ra_lab.general.apt_install
