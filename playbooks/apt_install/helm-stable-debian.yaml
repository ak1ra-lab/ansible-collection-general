---
# https://helm.sh/docs/intro/install/#from-apt-debianubuntu
- name: ak1ra_lab.general.apt_install - helm-stable-debian
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: true
  vars:
    # $ curl -sL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg
    # pub   rsa4096 2025-08-14 [SCEA]
    #       DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6
    # uid           packagecloud Helm Debian repository
    #               <support@packagecloud.io>
    # sub   rsa4096 2025-08-14 [SEA]
    apt_install_keyrings_url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    apt_install_keyrings_dest: /etc/apt/keyrings/helm-stable-debian.asc

    apt_install_repo: helm-stable-debian
    apt_install_repo_uris:
      - https://packages.buildkite.com/helm-linux/helm-debian/any/
    apt_install_repo_suites:
      - any
    apt_install_repo_components:
      - main

    apt_install_pinning: true
    apt_install_unattended_upgrade: true
    apt_install_mark_hold: false

    # Origin: packagecloud.io/01981580-ed3a-4eeb-95d7-352421e223e9/0198a8a8-22e4-7820-80bc-caff06dd9e6c
    # Label: 0198a8a8-22e4-7820-80bc-caff06dd9e6c
    # Date: Fri, 23 Jan 2026 05:08:09 +0000
    # Suite: any
    # Codename: any
    # Version: 1
    # Components: main
    # Architectures: alpha amd64 arm arm64 armel armhf avr32 hppa i386 ia64 m32
    # m68k mips mips64el mipsel musl-linux-amd64 powerpc ppc64 ppc64el riscv64
    # s390 s390x sh sparc
    apt_install_pinning_pin_release: >-
      o=packagecloud.io/01981580-ed3a-4eeb-95d7-352421e223e9/0198a8a8-22e4-7820-80bc-caff06dd9e6c
    apt_install_unattended_upgrade_origins_pattern: >-
      origin=packagecloud.io/01981580-ed3a-4eeb-95d7-352421e223e9/0198a8a8-22e4-7820-80bc-caff06dd9e6c

    apt_install_repo_packages: []

  tasks:
    - name: apply ak1ra_lab.general.apt_install role
      ansible.builtin.import_role:
        name: ak1ra_lab.general.apt_install
