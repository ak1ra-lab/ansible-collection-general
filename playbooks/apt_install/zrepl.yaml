---
# https://zrepl.github.io/installation/apt-repos.html
- name: ak1ra_lab.general.apt_install - zrepl
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: true
  vars:
    # curl -sL https://zrepl.cschwarz.com/apt/apt-key.asc | gpg
    # pub   rsa2048 2019-10-17 [SC]
    #       E101418FD3D6FBCB9D65A62D708699FC5F2EBF16
    # uid           Christian Schwarz <zrepl-debian-pkgs@cschwarz.com>
    # sub   rsa2048 2019-10-17 [E] [expired: 2022-10-17]
    # 这里有一个 expired 的 sub key, 不过它的用途是 [E] (Encrypt)
    # 用于 [SC] (Sign and Certify) 的 primary key 并没有指定有效期
    # 在讨论对 apt repo 签名时, 实际上签名的文件是 InRelease 或 Release + Release.gpg 文件
    apt_install_keyrings_url: https://zrepl.cschwarz.com/apt/apt-key.asc
    apt_install_keyrings_dest: /etc/apt/keyrings/zrepl.asc

    apt_install_repo: zrepl
    apt_install_repo_uris:
      - "https://zrepl.cschwarz.com/apt/{{ ansible_facts['distribution'] | lower }}"
    apt_install_repo_suites:
      - "{{ ansible_facts['distribution_release'] }}"
    apt_install_repo_components:
      - main

    apt_install_pinning: true
    apt_install_unattended_upgrade: false
    apt_install_mark_hold: true

    apt_install_repo_packages:
      - zrepl

  tasks:
    - name: apply ak1ra_lab.general.apt_install role
      ansible.builtin.import_role:
        name: ak1ra_lab.general.apt_install
