---
# https://www.mongodb.com/docs/manual/tutorial/install-mongodb-on-debian/
- name: ak1ra_lab.general.apt_install - mongodb-server
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: true
  vars:
    # https://repo.mongodb.org/apt/debian/dists/
    # bullseye/mongodb-org: [4.2, 4.4, 5.0, 6.0, 7.0]
    # bookworm/mongodb-org: [4.4, 5.0, 6.0, 7.0, 8.0]
    mongodb_version: "8.0"
    # https://pgp.mongodb.com/
    # curl -sL https://pgp.mongodb.com/server-8.0.asc | gpg
    # pub   rsa4096 2024-01-11 [SC]
    #       4B0752C1BCA238C0B4EE14DC41DE058A4E7DCA05
    # uid           MongoDB 8.0 Release Signing Key <packaging@mongodb.com>
    apt_install_keyrings_url: "https://pgp.mongodb.com/server-{{ mongodb_version }}.asc"
    apt_install_keyrings_dest: "/etc/apt/keyrings/mongodb-server-{{ mongodb_version }}.asc"

    apt_install_repo: "mongodb-server-{{ mongodb_version | replace('.', '-') }}"
    apt_install_repo_uris:
      - https://repo.mongodb.org/apt/debian
    apt_install_repo_suites:
      - "{{ ansible_facts['distribution_release'] }}/mongodb-org/{{ mongodb_version }}"
    apt_install_repo_components:
      - main

    apt_install_pinning: true
    apt_install_unattended_upgrade: false
    apt_install_mark_hold: false
    apt_install_pinning_pin_release: "o=mongodb,a={{ apt_install_repo_suites[0] }}"
    apt_install_unattended_upgrade_origins_pattern: "origin=mongodb,suite={{ apt_install_repo_suites[0] }}"

    # mongodb-org
    # Depends: mongodb-org-database, mongodb-org-tools, mongodb-mongosh
    apt_install_repo_packages: []

  tasks:
    - name: apply ak1ra_lab.general.apt_install role
      ansible.builtin.import_role:
        name: ak1ra_lab.general.apt_install
