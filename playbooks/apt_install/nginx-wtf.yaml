---
# https://n.wtf/install/
- name: ak1ra_lab.general.apt_install - nginx-wtf
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: true
  vars:
    # curl -sL https://n.wtf/public.key | gpg
    # pub   ed25519 2018-11-11 [SCA]
    #       1604614B4A6C2B73654BB8B6C5215CAF0055522F
    # uid           SB Professional Services <sb@sb.sb>
    # sub   cv25519 2018-11-11 [E]
    apt_install_keyrings_url: https://n.wtf/public.key
    apt_install_keyrings_dest: /etc/apt/keyrings/nginx-wtf-archive-keyring.asc

    apt_install_repo: nginx-wtf
    apt_install_repo_uris:
      - "https://mirror-cdn.xtom.com/sb/nginx/"
    apt_install_repo_suites:
      - "{{ ansible_facts['distribution_release'] }}"
    apt_install_repo_components:
      - main

    apt_install_pinning: true
    apt_install_unattended_upgrade: true
    apt_install_mark_hold: false
    apt_install_pinning_pin_release: "o=n.wtf,c=main,n={{ ansible_facts['distribution_release'] }}"
    apt_install_unattended_upgrade_origins_pattern: "origin=n.wtf,component=main,codename={{ ansible_facts['distribution_release'] }}"

    # nginx-extras
    apt_install_repo_packages:
      - nginx-extras

  tasks:
    - name: apply ak1ra_lab.general.apt_install role
      ansible.builtin.import_role:
        name: ak1ra_lab.general.apt_install
