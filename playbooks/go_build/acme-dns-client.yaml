---
# ansible-playbook playbooks/go_build/acme-dns-client.yaml -e 'playbook_hosts=localhost'
- name: execute go build acme-dns-client
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: false

  tasks:
    - name: build acme-dns/acme-dns-client binary on localhost
      become: false
      ansible.builtin.import_role:
        name: ak1ra_lab.general.go_build
      vars:
        go_build_repo_url: "https://github.com/acme-dns/acme-dns-client.git"
        go_build_repo_version: "master"
        go_build_package: "."
        go_build_output_name: "acme-dns-client"

    - name: copy acme-dns-client binary to /usr/local/bin
      become: true
      ansible.builtin.copy:
        src: "{{ go_build_binary_path }}"
        dest: "/usr/local/bin/acme-dns-client"
        mode: "0755"
        owner: root
        group: root
