---
# ansible-playbook playbooks/go_build/nali.yaml -e 'playbook_hosts=localhost'
- name: execute go build zu1k/nali
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: false

  tasks:
    - name: build zu1k/nali binary on localhost
      become: false
      ansible.builtin.import_role:
        name: ak1ra_lab.general.go_build
      vars:
        go_build_repo_url: "https://github.com/zu1k/nali.git"
        go_build_repo_version: "master"
        go_build_package: "."
        go_build_output_name: "nali"

    - name: copy nali binary to /usr/local/bin
      become: true
      ansible.builtin.copy:
        src: "{{ go_build_binary_path }}"
        dest: "/usr/local/bin/nali"
        mode: "0755"
        owner: root
        group: root
