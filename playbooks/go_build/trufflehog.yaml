---
# ansible-playbook playbooks/go_build/trufflehog.yaml -e 'playbook_hosts=localhost'
- name: execute go build trufflesecurity/trufflehog
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: false

  tasks:
    - name: build trufflesecurity/trufflehog binary on localhost
      become: false
      ansible.builtin.import_role:
        name: ak1ra_lab.general.go_build
      vars:
        go_build_repo_url: "https://github.com/trufflesecurity/trufflehog.git"
        go_build_repo_version: "main"
        go_build_package: "."
        go_build_output_name: "trufflehog"

    - name: copy trufflehog binary to /usr/local/bin
      become: true
      ansible.builtin.copy:
        src: "{{ go_build_binary_path }}"
        dest: "/usr/local/bin/trufflehog"
        mode: "0755"
        owner: root
        group: root
