---
# ansible-playbook playbooks/go_build/yamlfmt.yaml -e 'playbook_hosts=localhost'
- name: execute go build google/yamlfmt
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: false

  tasks:
    - name: build google/yamlfmt binary on localhost
      become: false
      ansible.builtin.import_role:
        name: ak1ra_lab.general.go_build
      vars:
        go_build_repo_url: "https://github.com/google/yamlfmt.git"
        go_build_repo_version: "main"
        go_build_package: "./cmd/yamlfmt"
        go_build_output_name: "yamlfmt"

    - name: copy yamlfmt binary to /usr/local/bin
      become: true
      ansible.builtin.copy:
        src: "{{ go_build_binary_path }}"
        dest: "/usr/local/bin/yamlfmt"
        mode: "0755"
        owner: root
        group: root
