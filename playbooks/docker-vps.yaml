---
- name: import playbooks/debian-base-vps.yaml
  ansible.builtin.import_playbook: debian-base-vps.yaml

- name: ak1ra_lab.general.docker | vps
  hosts: "{{ playbook_hosts | default('localhost') }}"
  become: true
  vars:
    docker_apt_pinning: true
    docker_apt_unattended_upgrade: true
    docker_apt_mark_hold: false

  tasks:
    - name: apply ak1ra_lab.general.docker role
      ansible.builtin.import_role:
        name: ak1ra_lab.general.docker
