[project]
name = "ansible-collection-general"
version = "0.1.0"
description = "Development tooling for the ak1ra_lab.general Ansible collection"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
# Shared Ansible runtime: ansible-galaxy reads the galaxy.yml manifest through
# distlib when installing the collection from source.
ansible = [
    "ansible-core>=2.19.12",
    "distlib>=0.4.4",
]
lint = [
    { include-group = "ansible" },
    "ansible-lint>=26.8.0",
    "antsibull-changelog>=0.32.0",
    "antsibull-docs>=2.28,<3",
    "galaxy-importer>=0.4.31",
    "mypy>=1.18.0",
    "ruff>=0.17.0",
]
test = [
    { include-group = "ansible" },
    "pytest>=8",
    "tox>=4.2",
    "tox-ansible>=26.10.0",
]
docs = [
    { include-group = "ansible" },
    "antsibull-docs>=2.28,<3",
    "ansible-pygments>=0.1.1",
    "sphinx>=8,<10",
    "sphinx-ansible-theme>=0.10.3",
]
molecule = [
    { include-group = "ansible" },
    "molecule>=26.8.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "molecule" },
    "pre-commit>=4.2.0",
]

# The collection modules import their module_utils through the installed
# collection namespace (ansible_collections.ak1ra_lab.general...). Install the
# collection into .ansible/collections before running mypy (`just typecheck`
# does this), or point mypy_path at an equivalent collection root.
[tool.mypy]
python_version = "3.11"
files = ["plugins", "tests"]
mypy_path = ".ansible/collections"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

# Standard tox-ansible harness. The plugin generates the ansible-core 2.19,
# 2.20, 2.21 and devel/milestone matrix from the upstream support matrix;
# `tox list --ansible` shows the result. Do not add an ad-hoc skip list: drop
# an environment with `uv run tox -e <env> --ansible` instead.
[tool.tox]
requires = ["tox>=4.2"]

[tool.tox-ansible]
molecule = "auto"
