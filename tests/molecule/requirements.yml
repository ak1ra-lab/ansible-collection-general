---
# Collections installed by tox-ansible/ade for the Molecule scenarios.
# The collection under test is installed editable by tox-ansible itself; its
# runtime dependencies (ansible.posix, community.general) are declared in
# galaxy.yml and are repeated here only because the shared Molecule lifecycle
# runs before ansible-compat's dependency action.
collections:
  - name: ansible.posix
  - name: community.general
  - name: containers.podman
  - name: community.docker
