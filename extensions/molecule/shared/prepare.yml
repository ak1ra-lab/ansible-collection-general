---
# Shared preparation for every component scenario.
#
# The ak1ra-lab/docker-systemd images ship an apt index from their build
# time; it goes stale as the distributions publish new package versions, and
# the roles' `package` installs then fail with 404s.  Every preparation
# refreshes the index first (the components share one container, so
# `cache_valid_time` keeps this to one refresh per test run).
#
# Scenario-specific prepare.yml files import this play first and then add
# their own prerequisites.

- name: prepare the shared containers
  hosts: all
  gather_facts: true
  tasks:
    - name: refresh the apt index (the images ship one from build time)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
