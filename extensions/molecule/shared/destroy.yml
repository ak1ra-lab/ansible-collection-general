---
# Destroy this scenario's containers.

- name: destroy the scenario test containers
  hosts: localhost
  gather_facts: false
  vars:
    _molecule_container_runtime: "{{ lookup('ansible.builtin.env', 'MOLECULE_CONTAINER_RUNTIME') | default('podman', true) }}"
    _molecule_container_group: "{{ lookup('ansible.builtin.env', 'MOLECULE_CONTAINER_GROUP') | default('test_resources_debian', true) }}"
  tasks:
    - name: remove containers with podman
      when: _molecule_container_runtime == 'podman'
      containers.podman.podman_container:
        name: "{{ hostvars[item]['ansible_host'] }}"
        state: absent
      loop: "{{ groups[_molecule_container_group] }}"
      loop_control:
        label: "{{ item }}"

    - name: remove containers with docker
      when: _molecule_container_runtime == 'docker'
      community.docker.docker_container:
        name: "{{ hostvars[item]['ansible_host'] }}"
        state: absent
      loop: "{{ groups[_molecule_container_group] }}"
      loop_control:
        label: "{{ item }}"
