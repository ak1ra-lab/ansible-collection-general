---
# certbot/acmedns scenario - shared container preparation plus a fake
# acme-dns /update API on 127.0.0.1:8056.

- name: run the shared container preparation
  import_playbook: ../../shared/prepare.yml

- name: prepare the fake acme-dns API
  hosts: all
  gather_facts: false
  vars:
    _certbot_acmedns_dir: /tmp/molecule-ak1ra-general-certbot-acmedns
  tasks:
    - name: create the fake acme-dns directory
      ansible.builtin.file:
        path: "{{ _certbot_acmedns_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: write the fake acme-dns API
      ansible.builtin.copy:
        content: |
          #!/usr/bin/env python3
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          LOG = "{{ _certbot_acmedns_dir }}/requests.jsonl"


          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  body = json.loads(self.rfile.read(length).decode())
                  record = {
                      "path": self.path,
                      "user": self.headers.get("X-Api-User"),
                      "key": self.headers.get("X-Api-Key"),
                      "body": body,
                  }
                  with open(LOG, "a", encoding="utf-8") as handle:
                      handle.write(json.dumps(record) + "\n")
                  response = json.dumps({"txt": body.get("txt", "")}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(response)))
                  self.end_headers()
                  self.wfile.write(response)

              def log_message(self, *args):
                  pass


          HTTPServer(("127.0.0.1", 8056), Handler).serve_forever()
        dest: "{{ _certbot_acmedns_dir }}/fake-acmedns.py"
        owner: root
        group: root
        mode: "0755"

    - name: start the fake acme-dns API
      ansible.builtin.shell:
        cmd: >-
          nohup python3 {{ _certbot_acmedns_dir }}/fake-acmedns.py
          > {{ _certbot_acmedns_dir }}/server.log 2>&1 &
          echo $! > {{ _certbot_acmedns_dir }}/server.pid
        chdir: "{{ _certbot_acmedns_dir }}"
      changed_when: true

    - name: wait for the fake acme-dns API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8056
        timeout: 30

- name: seed the persisted acme-dns credentials on the controller
  hosts: localhost
  gather_facts: false
  vars:
    _certbot_acmedns_dir: /tmp/molecule-ak1ra-general-certbot-acmedns
  tasks:
    - name: create the controller credentials directory
      ansible.builtin.file:
        path: "{{ _certbot_acmedns_dir }}/controller"
        state: directory
        mode: "0755"

    - name: write the persisted acme-dns account registry
      ansible.builtin.copy:
        content: |
          acme_dns_register_server_url: http://127.0.0.1:8056
          acme_dns_register_accounts:
            example.com:
              username: molecule-user-base
              password: molecule-key-base
              subdomain: molecule-subdomain-base
              fulldomain: molecule-subdomain-base.auth.example.invalid
            www.example.com:
              username: molecule-user-www
              password: molecule-key-www
              subdomain: molecule-subdomain-www
              fulldomain: molecule-subdomain-www.auth.example.invalid
        dest: "{{ _certbot_acmedns_dir }}/controller/acme_dns_credentials.yaml"
        mode: "0600"
