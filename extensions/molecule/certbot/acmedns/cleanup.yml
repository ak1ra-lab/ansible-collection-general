---
# certbot/acmedns scenario - stop the fake API and remove the rendered
# acme-dns files.

- name: tear down the certbot acme-dns fixtures
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  vars:
    _certbot_acmedns_dir: /tmp/molecule-ak1ra-general-certbot-acmedns
  tasks:
    - name: stop the fake acme-dns API
      ansible.builtin.shell:
        cmd: >-
          if [ -f {{ _certbot_acmedns_dir }}/server.pid ]; then
            kill "$(cat {{ _certbot_acmedns_dir }}/server.pid)" || true;
          fi
      changed_when: false
      failed_when: false

    - name: remove the acme-dns state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/letsencrypt
        - /var/lib/letsencrypt
        - /var/log/letsencrypt
        - "{{ _certbot_acmedns_dir }}"

# The controller directory is shared by every managed node.  Removing it
# with delegate_to from the per-host play makes both delegated tasks race
# on the same localhost rmtree; run it once in its own localhost play.
- name: remove the persisted acme-dns controller credentials
  hosts: localhost
  gather_facts: false
  vars:
    _certbot_acmedns_dir: /tmp/molecule-ak1ra-general-certbot-acmedns
  tasks:
    - name: remove the persisted controller credentials
      ansible.builtin.file:
        path: "{{ _certbot_acmedns_dir }}"
        state: absent
