---
# acme_dns_register/basic scenario - register two validation domains, with
# example.com and *.example.com sharing one account.

- name: register acme-dns accounts
  hosts: localhost
  gather_facts: false
  vars:
    acme_dns_register_server_url: http://127.0.0.1:8057
    acme_dns_register_acme_domains:
      - example.com
      - "*.example.com"
      - www.example.com
    acme_dns_register_credentials_dir: /tmp/molecule-ak1ra-general-acme-dns-register/controller
    acme_dns_register_manual_prompt: false
  tasks:
    - name: include the acme_dns_register role
      ansible.builtin.include_role:
        name: ak1ra_lab.general.acme_dns_register
