---
# acme_dns_register/basic scenario - start a fake acme-dns /register API on
# localhost.  The role runs on the controller, so no container is needed.

- name: prepare the fake acme-dns registration API
  hosts: localhost
  gather_facts: false
  vars:
    _acme_dns_register_dir: /tmp/molecule-ak1ra-general-acme-dns-register
  tasks:
    - name: create the fake acme-dns directory
      ansible.builtin.file:
        path: "{{ _acme_dns_register_dir }}"
        state: directory
        mode: "0755"

    - name: write the fake acme-dns registration API
      ansible.builtin.copy:
        content: |
          #!/usr/bin/env python3
          import json
          import uuid
          from http.server import BaseHTTPRequestHandler, HTTPServer

          LOG = "{{ _acme_dns_register_dir }}/requests.jsonl"


          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  raw = self.rfile.read(length).decode() if length else ""
                  try:
                      body = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      body = {"raw": raw}

                  record = {"path": self.path, "body": body}
                  with open(LOG, "a", encoding="utf-8") as handle:
                      handle.write(json.dumps(record) + "\n")

                  if self.path == "/register":
                      subdomain = str(uuid.uuid4())
                      response = {
                          "username": str(uuid.uuid4()),
                          "password": uuid.uuid4().hex,
                          "subdomain": subdomain,
                          "fulldomain": f"{subdomain}.auth.example.invalid",
                      }
                      payload = json.dumps(response).encode()
                      self.send_response(201)
                  else:
                      payload = json.dumps({"txt": body.get("txt", "")}).encode()
                      self.send_response(200)

                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, *args):
                  pass


          HTTPServer(("127.0.0.1", 8057), Handler).serve_forever()
        dest: "{{ _acme_dns_register_dir }}/fake-acmedns.py"
        mode: "0755"

    - name: start the fake acme-dns registration API
      ansible.builtin.shell:
        cmd: >-
          nohup python3 {{ _acme_dns_register_dir }}/fake-acmedns.py
          > {{ _acme_dns_register_dir }}/server.log 2>&1 &
          echo $! > {{ _acme_dns_register_dir }}/server.pid
        chdir: "{{ _acme_dns_register_dir }}"
      changed_when: true

    - name: wait for the fake acme-dns registration API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8057
        timeout: 30
