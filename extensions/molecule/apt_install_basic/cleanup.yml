---
# apt_install_basic scenario - remove the test repository artifacts and the
# installed package.  The role has no absent mode, so the teardown is
# explicit; it tolerates a fresh host (nothing applied) and an unreachable
# container (destroyed before cleanup).

- name: tear down the apt_install test repository
  hosts: test_resources_debian
  gather_facts: false
  ignore_unreachable: true
  tasks:
    - name: check whether the test package is installed
      ansible.builtin.stat:
        path: /var/lib/dpkg/info/postgresql-client-17.list
      register: _apt_install_teardown_pkg

    - name: unhold and remove the test package
      when: _apt_install_teardown_pkg.stat.exists
      block:
        - name: unhold the test package
          ansible.builtin.dpkg_selections:
            name: postgresql-client-17
            selection: install

        - name: remove the test package
          ansible.builtin.apt:
            name: postgresql-client-17
            state: absent
            purge: true

    - name: remove the repository artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pgdg.sources
        - /etc/apt/sources.list.d/pgdg.list
        - /etc/apt/keyrings/postgresql-pgdg.asc
        - /etc/apt/preferences.d/90pgdg
        - /etc/apt/apt.conf.d/90unattended-upgrades-pgdg
