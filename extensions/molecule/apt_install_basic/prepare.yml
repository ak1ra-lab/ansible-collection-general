---
# apt_install_basic scenario - shared preparation plus the legacy-source
# fixture: a pre-DEB822 `.list` entry that the role must remove.  The entry is
# commented out so the APT update that runs early in the role never tries to
# fetch an unsigned third-party source.

- name: run the shared container preparation
  import_playbook: ../shared/prepare.yml

- name: seed the legacy apt_install drift
  hosts: test_resources_debian
  gather_facts: false
  tasks:
    - name: seed a legacy sources.list.d entry (removed by the role)
      ansible.builtin.copy:
        content: |
          # Molecule fixture: a legacy pre-DEB822 entry removed by apt_install.
          # deb https://apt.postgresql.org/pub/repos/apt trixie-pgdg main
        dest: /etc/apt/sources.list.d/pgdg.list
        mode: "0644"
