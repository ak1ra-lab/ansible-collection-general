---
# apt_install_basic scenario - apply the PostgreSQL PGDG repository with the role
# defaults: keyring from the repository's
# GPG URL, default origin pinning, default site unattended-upgrades pattern,
# and one package installed from the new repository and held.

- name: apply the PostgreSQL PGDG repository
  hosts: test_resources_debian
  gather_facts: true
  vars:
    apt_install_keyrings_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    apt_install_keyrings_dest: /etc/apt/keyrings/postgresql-pgdg.asc

    apt_install_repo: pgdg
    apt_install_repo_uris:
      - https://apt.postgresql.org/pub/repos/apt
    apt_install_repo_suites:
      - "{{ ansible_facts['distribution_release'] }}-pgdg"
    apt_install_repo_components:
      - main

    apt_install_pinning: true
    apt_install_unattended_upgrade: true
    apt_install_mark_hold: true

    apt_install_repo_packages:
      - postgresql-client-17
  tasks:
    - name: apply ak1ra_lab.general.apt_install
      ansible.builtin.include_role:
        name: ak1ra_lab.general.apt_install
