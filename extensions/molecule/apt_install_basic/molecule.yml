---
# apt_install_basic scenario - the enabled happy path against a real
# third-party repository (the same shape as
# playbooks/apt_install/tailscale.yaml), followed by the role's revert
# switches and the scenario teardown.
#
# The sequence refreshes the APT index in a side effect before verify (rather
# than mutating state inside verify.yml), then applies the role with
# `apt_install_pinning: false`, `apt_install_unattended_upgrade: false`
# and `apt_install_repo_enabled: false` and verifies the removal.
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - side_effect revert.yml
    - verify revert-verify.yml
    - cleanup
    - verify absent-verify.yml
    - destroy
