---
# apt_repository_ubuntu - shared preparation and the dependency-install fixture.

- name: run the shared container preparation
  import_playbook: ../shared/prepare.yml

- name: remove python3-debian so the role exercises its dependency install
  hosts: test_resources_ubuntu
  gather_facts: false
  tasks:
    - name: remove python3-debian
      ansible.builtin.apt:
        name: python3-debian
        state: absent
        purge: true
