---
# debian_base scenario - assert the baseline an operator observes: the
# rendered DEB822 sources, the backports pin, the optional drop-ins, the
# baseline package, the sudoers rule, and a working APT update.

- name: verify the converged debian_base state
  hosts: test_resources_debian
  gather_facts: true
  tasks:
    - name: collect the sources.list placeholder
      ansible.builtin.slurp:
        src: /etc/apt/sources.list
      register: _debian_base_placeholder

    - name: assert the legacy sources.list is a placeholder
      ansible.builtin.assert:
        that:
          - "'sources.list.d/debian.sources' in (_debian_base_placeholder.content | ansible.builtin.b64decode)"
        fail_msg: >-
          unexpected sources.list placeholder:
          {{ _debian_base_placeholder.content | ansible.builtin.b64decode }}
        quiet: true

    - name: collect the Debian archive source
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/debian.sources
      register: _debian_base_sources

    - name: assert the archive source carries the release suites and backports
      ansible.builtin.assert:
        that:
          - "'URIs: https://deb.debian.org/debian/' in (_debian_base_sources.content | ansible.builtin.b64decode)"
          - (ansible_facts['distribution_release'] ~ '-updates') in (_debian_base_sources.content | ansible.builtin.b64decode)
          - (ansible_facts['distribution_release'] ~ '-backports') in (_debian_base_sources.content | ansible.builtin.b64decode)
        fail_msg: >-
          unexpected debian.sources:
          {{ _debian_base_sources.content | ansible.builtin.b64decode }}
        quiet: true

    - name: collect the Debian security source
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/debian-security.sources
      register: _debian_base_security

    - name: assert the security source is rendered
      ansible.builtin.assert:
        that:
          - "'URIs: https://deb.debian.org/debian-security/' in (_debian_base_security.content | ansible.builtin.b64decode)"
          - (ansible_facts['distribution_release'] ~ '-security') in (_debian_base_security.content | ansible.builtin.b64decode)
        fail_msg: >-
          unexpected debian-security.sources:
          {{ _debian_base_security.content | ansible.builtin.b64decode }}
        quiet: true

    - name: collect the backports pinning file
      ansible.builtin.slurp:
        src: /etc/apt/preferences.d/90debian-backports
      register: _debian_base_backports

    - name: set the expected backports pin line
      ansible.builtin.set_fact:
        _debian_base_backports_pin: "{{ 'Pin: release n=' ~ ansible_facts['distribution_release'] ~ '-backports' }}"

    - name: assert the backports pin is in place
      ansible.builtin.assert:
        that:
          - _debian_base_backports_pin in (_debian_base_backports.content | ansible.builtin.b64decode)
          - "'Pin-Priority: 500' in (_debian_base_backports.content | ansible.builtin.b64decode)"
        fail_msg: >-
          unexpected backports pin:
          {{ _debian_base_backports.content | ansible.builtin.b64decode }}
        quiet: true

    - name: collect the unattended-upgrades drop-ins
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _debian_base_unattended
      loop:
        - /etc/apt/apt.conf.d/90unattended-upgrades-updates
        - /etc/apt/apt.conf.d/90unattended-upgrades-backports
        - /etc/apt/apt.conf.d/90unattended-upgrades-automatic-reboot
        - /etc/apt/apt.conf.d/99force-ipv4

    - name: assert the enabled and disabled drop-ins match the switches
      ansible.builtin.assert:
        that:
          - _debian_base_unattended.results[0].stat.exists
          - not _debian_base_unattended.results[1].stat.exists
          - not _debian_base_unattended.results[2].stat.exists
          - _debian_base_unattended.results[3].stat.exists
        fail_msg: "unexpected unattended-upgrades or force-ipv4 drop-in state"
        quiet: true

    - name: collect the force-IPv4 drop-in
      ansible.builtin.slurp:
        src: /etc/apt/apt.conf.d/99force-ipv4
      register: _debian_base_force_ipv4

    - name: assert the force-IPv4 drop-in is managed by apt_conf
      ansible.builtin.assert:
        that:
          - "'ak1ra_lab.general.apt_conf' in (_debian_base_force_ipv4.content | ansible.builtin.b64decode)"
          - "'Acquire::ForceIPv4 \"true\";' in (_debian_base_force_ipv4.content | ansible.builtin.b64decode)"
        fail_msg: "unexpected force-IPv4 drop-in"
        quiet: true

    - name: collect the APT proxy drop-in
      ansible.builtin.stat:
        path: /etc/apt/apt.conf.d/90ansible-debian-base-proxy
      register: _debian_base_apt_proxy

    - name: assert the APT proxy drop-in is absent when no proxy is configured
      ansible.builtin.assert:
        that:
          - not _debian_base_apt_proxy.stat.exists
        fail_msg: "the APT proxy drop-in must be absent when both proxies are empty"
        quiet: true

    - name: collect the baseline package status
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${Status}", hello]
      changed_when: false
      register: _debian_base_hello

    - name: assert the baseline package is installed
      ansible.builtin.assert:
        that:
          - _debian_base_hello.stdout is ansible.builtin.search('ok installed')
        fail_msg: >-
          unexpected package status: {{ _debian_base_hello.stdout }}
        quiet: true

    - name: collect the backports package status
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${Status}", linux-libc-dev]
      changed_when: false
      register: _debian_base_linux_libc_dev

    - name: assert the backports package is installed
      ansible.builtin.assert:
        that:
          - _debian_base_linux_libc_dev.stdout is ansible.builtin.search('ok installed')
        fail_msg: >-
          unexpected package status: {{ _debian_base_linux_libc_dev.stdout }}
        quiet: true

    - name: collect the backports package policy
      ansible.builtin.command:
        argv: [apt-cache, policy, linux-libc-dev]
      changed_when: false
      register: _debian_base_linux_libc_dev_policy

    - name: assert the backports suite is available for the package
      ansible.builtin.assert:
        that:
          - >-
            _debian_base_linux_libc_dev_policy.stdout is ansible.builtin.search(
              ansible_facts['distribution_release'] ~ '-backports/main'
            )
        fail_msg: >-
          the backports suite is not available for linux-libc-dev:
          {{ _debian_base_linux_libc_dev_policy.stdout }}
        quiet: true

    - name: collect the sudoers rule
      ansible.builtin.slurp:
        src: /etc/sudoers.d/sudo
      register: _debian_base_sudoers

    - name: assert passwordless sudo is granted to the sudo group
      ansible.builtin.assert:
        that:
          - "'NOPASSWD' in (_debian_base_sudoers.content | ansible.builtin.b64decode)"
          - "'%sudo' in (_debian_base_sudoers.content | ansible.builtin.b64decode)"
        fail_msg: >-
          unexpected sudoers rule:
          {{ _debian_base_sudoers.content | ansible.builtin.b64decode }}
        quiet: true

    - name: collect the deb822 repository helper state
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${Status}", python3-debian]
      changed_when: false
      register: _debian_base_python3_debian

    - name: assert the deb822 repository helper is installed
      ansible.builtin.assert:
        that:
          - _debian_base_python3_debian.stdout is ansible.builtin.search('ok installed')
        fail_msg: >-
          unexpected python3-debian status:
          {{ _debian_base_python3_debian.stdout }}
        quiet: true
