---
# Shared settings for the test_resources group; per-host images live in
# hosts.yml.
#
# The container runtime is selectable through the environment so the same
# scenarios run unchanged on Podman (default) or on a Docker daemon:
#
#   MOLECULE_CONTAINER_RUNTIME=docker just molecule-test
#
# Docker needs the community.docker collection (tests/molecule/requirements.yml)
# and its Python SDK on the control node.  Both runtimes run the containers
# privileged: systemd needs the capabilities anyway, and a privileged
# container also gets the writable /sys that the systemd units and future
# kernel-touching roles require.

_molecule_container_runtime: "{{ lookup('ansible.builtin.env', 'MOLECULE_CONTAINER_RUNTIME') | default('podman', true) }}"

ansible_connection: >-
  {{ 'community.docker.docker'
     if _molecule_container_runtime == 'docker'
     else 'containers.podman.podman' }}

container_command: /sbin/init
container_systemd: always
container_privileged: true
