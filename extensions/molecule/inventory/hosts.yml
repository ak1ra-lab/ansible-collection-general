---
# Supported managed nodes for every Molecule scenario.
#
# The APT-based roles are exercised on Debian by default.  The
# apt_repository_ubuntu scenario selects the Ubuntu group through
# MOLECULE_CONTAINER_GROUP and reuses the same container lifecycle.
#
# The container name is derived per scenario here so parallel scenarios and
# checkouts do not collide; only the image and the name live here.
#
# Images are tracked by tag.  Pin them by digest in the consumer repository if
# reproducible image pulls are required; the upstream docker-systemd images
# are rebuilt for package updates.

all:
  vars:
    _molecule_container_scenario: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}"
    _molecule_checkout_id: "{{ (lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') | ansible.builtin.to_uuid)[:8] }}"
  children:
    test_resources:
      children:
        test_resources_debian:
          hosts:
            debian-12:
              # ansible_host must be a literal template that does not depend on
              # inventory_hostname: delegated connection variables are resolved
              # in the delegating host's context (localhost).
              ansible_host: >-
                molecule-general-{{ _molecule_container_scenario }}-{{ _molecule_checkout_id }}-debian-12
              container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:12
            debian-13:
              ansible_host: >-
                molecule-general-{{ _molecule_container_scenario }}-{{ _molecule_checkout_id }}-debian-13
              container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:13
        test_resources_ubuntu:
          hosts:
            ubuntu-24.04:
              ansible_host: >-
                molecule-general-{{ _molecule_container_scenario }}-{{ _molecule_checkout_id }}-ubuntu-24.04
              container_image: ghcr.io/ak1ra-lab/docker-systemd/ubuntu:24.04
            ubuntu-26.04:
              ansible_host: >-
                molecule-general-{{ _molecule_container_scenario }}-{{ _molecule_checkout_id }}-ubuntu-26.04
              container_image: ghcr.io/ak1ra-lab/docker-systemd/ubuntu:26.04
