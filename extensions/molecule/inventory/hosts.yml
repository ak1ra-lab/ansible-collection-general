---
# Supported managed nodes for every Molecule scenario.
#
# The APT-based roles (apt_install, debian_base, docker) are Debian-only by
# contract; go_build and pyproject_install are distribution-agnostic but are
# exercised on the same images, so the supported matrix is Debian 12/13.
#
# The container name is derived per scenario here so parallel scenarios and
# checkouts do not collide; only the image and the name live here.
#
# Images are tracked by tag.  Pin them by digest in the consumer repository if
# reproducible image pulls are required; the upstream docker-systemd images
# are rebuilt for package updates.

all:
  children:
    test_resources:
      hosts:
        debian-12:
          # ansible_host must be a literal template that does not depend on
          # inventory_hostname: delegated connection variables are resolved in
          # the delegating host's context (localhost).
          ansible_host: >-
            molecule-general-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}-{{ (lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | to_uuid)[:8] }}-debian-12
          container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:12
        debian-13:
          ansible_host: >-
            molecule-general-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}-{{ (lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | to_uuid)[:8] }}-debian-13
          container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:13
