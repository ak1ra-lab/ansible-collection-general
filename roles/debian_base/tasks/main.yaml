---
- name: assert ansible_facts['distribution'] is debian
  ansible.builtin.assert:
    that:
      - (ansible_facts['distribution'] | lower) == 'debian'
      - (ansible_facts['distribution_major_version'] | int) >= 12
    fail_msg: "roles/debian_base currently only support Debian Linux"

- name: include_tasks if os_family is debian
  when:
    - (ansible_facts['os_family'] | lower) == 'debian'
    - (ansible_facts['distribution_major_version'] | int) >= 11
  ansible.builtin.include_tasks: debian.yaml

# The module automatically uses visudo for validation if available
- name: Grant group 'sudo' with NOPASSWD sudo access
  community.general.sudoers:
    name: sudo
    group: sudo
    commands: ALL
    runas: ALL
    nopassword: true

- name: enable tcp_bbr
  when:
    - ansible_facts['kernel'] is ansible.builtin.version('4.9.0', '>=')
    - (debian_base_tcp_bbr_enabled | ansible.builtin.bool)
  ansible.builtin.include_tasks: tcp_bbr.yaml

- name: enable net.ipv4.ip_forward
  when:
    - (debian_base_ip_forward_enabled | ansible.builtin.bool)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: 1
    state: present
    sysctl_file: "{{ _debian_base_sysctl_file }}"
    reload: true
    ignoreerrors: true

- name: write the role-owned sshd drop-in
  when:
    - (debian_base_custom_sshd_config_enabled | ansible.builtin.bool)
  ansible.builtin.template:
    src: etc/ssh/sshd_config.d/00-ansible-debian-base.conf.j2
    dest: "{{ _debian_base_sshd_config_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  register: _debian_base_sshd_dropin
  notify:
    - reload ssh

- name: remove the role-owned sshd drop-in
  when:
    - not (debian_base_custom_sshd_config_enabled | ansible.builtin.bool)
  ansible.builtin.file:
    path: "{{ _debian_base_sshd_config_file }}"
    state: absent
  register: _debian_base_sshd_dropin_removed
  notify:
    - reload ssh

- name: validate the effective sshd configuration
  when: >-
    (_debian_base_sshd_dropin is changed)
    or (_debian_base_sshd_dropin_removed is changed)
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false

- name: apply the custom sysctl entries
  when: debian_base_custom_sysctl_conf_enabled
  ansible.posix.sysctl:
    name: "{{ entry.name }}"
    value: "{{ entry.value }}"
    state: present
    sysctl_file: "{{ _debian_base_sysctl_file }}"
    reload: true
    ignoreerrors: true
  loop: "{{ debian_base_custom_sysctl_conf_entries }}"
  loop_control:
    loop_var: entry

- name: ensure qemu-guest-agent package installed
  when:
    - (debian_base_qemu_guest_agent_enabled | ansible.builtin.bool)
  ansible.builtin.package:
    name:
      - qemu-guest-agent
    state: present
  notify:
    - ensure qemu-guest-agent enabled
