---
- name: manage the unattended-upgrades updates policy
  ak1ra_lab.general.apt_unattended_upgrades:
    path: /etc/apt/apt.conf.d/90unattended-upgrades-updates
    state: "{{ 'present' if debian_base_unattended_upgrade_updates_enabled | ansible.builtin.bool else 'absent' }}"
    origins_patterns:
      - "origin=Debian,codename=${distro_codename}-updates"

- name: manage the unattended-upgrades backports policy
  ak1ra_lab.general.apt_unattended_upgrades:
    path: /etc/apt/apt.conf.d/90unattended-upgrades-backports
    state: >-
      {{
        'present'
        if (
          (debian_base_apt_repo_debian_backports_enabled | ansible.builtin.bool) and
          (debian_base_unattended_upgrade_backports_enabled | ansible.builtin.bool)
        )
        else 'absent'
      }}
    origins_patterns:
      - "origin=Debian Backports,codename=${distro_codename}-backports,label=Debian Backports"

- name: manage the unattended-upgrades automatic reboot policy
  ak1ra_lab.general.apt_unattended_upgrades:
    path: /etc/apt/apt.conf.d/90unattended-upgrades-automatic-reboot
    state: >-
      {{
        'present'
        if debian_base_unattended_upgrade_automatic_reboot_enabled | ansible.builtin.bool
        else 'absent'
      }}
    automatic_reboot: true
    automatic_reboot_time: "{{ debian_base_unattended_upgrade_automatic_reboot_time }}"
