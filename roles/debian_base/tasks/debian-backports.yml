---
- name: manage the Debian backports APT preference
  ak1ra_lab.general.apt_preference:
    path: /etc/apt/preferences.d/90debian-backports
    state: "{{ 'present' if debian_base_apt_repo_debian_backports_enabled | ansible.builtin.bool else 'absent' }}"
    entries:
      - packages: "{{ debian_base_apt_repo_debian_backports_preferences_package }}"
        pin:
          release:
            codename: "{{ ansible_facts['distribution_release'] }}-backports"
        priority: "{{ debian_base_apt_repo_debian_backports_preferences_pin_priority | int }}"
