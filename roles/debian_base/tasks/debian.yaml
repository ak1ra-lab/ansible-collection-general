---
- name: append debian-backports on debian_base_apt_repo_debian_suites
  when:
    - (debian_base_apt_repo_debian_backports_enabled | ansible.builtin.bool)
  ansible.builtin.set_fact:
    debian_base_apt_repo_debian_suites: "{{ debian_base_apt_repo_debian_suites | default([]) + [ansible_facts['distribution_release'] ~ '-backports'] }}"

- name: ensure python3-debian installed for deb822_repository module
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true

- name: create /etc/apt/sources.list placeholder
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    mode: "0644"
    content: |
      # See /etc/apt/sources.list.d/debian.sources and /etc/apt/sources.list.d/debian-security.sources

- name: add debian.sources in DEB822 format
  vars:
    default_types:
      - deb
    default_uris:
      - https://deb.debian.org/debian/
    default_suites:
      - "{{ ansible_facts['distribution_release'] }}"
      - "{{ ansible_facts['distribution_release'] }}-updates"
    default_components:
      - main
  ansible.builtin.deb822_repository:
    name: debian
    state: present
    enabled: true
    types: "{{ debian_base_apt_repo_debian_types | default(default_types) }}"
    uris: "{{ debian_base_apt_repo_debian_uris | default(default_uris) }}"
    suites: "{{ debian_base_apt_repo_debian_suites | default(default_suites) }}"
    components: "{{ debian_base_apt_repo_debian_components | default(default_components) }}"
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg

- name: add debian-security.sources in DEB822 format
  vars:
    default_types:
      - deb
    default_uris:
      - https://deb.debian.org/debian-security/
    default_suites:
      - "{{ ansible_facts['distribution_release'] }}-security"
    default_components:
      - main
  ansible.builtin.deb822_repository:
    name: debian-security
    state: present
    enabled: true
    types: "{{ debian_base_apt_repo_debian_security_types | default(default_types) }}"
    uris: "{{ debian_base_apt_repo_debian_security_uris | default(default_uris) }}"
    suites: "{{ debian_base_apt_repo_debian_security_suites | default(default_suites) }}"
    components: "{{ debian_base_apt_repo_debian_security_components | default(default_components) }}"
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg

- name: include_tasks unattended-upgrades.yaml
  ansible.builtin.include_tasks: unattended-upgrades.yaml

- name: include_tasks debian-backports.yaml
  ansible.builtin.include_tasks: debian-backports.yaml

- name: include_tasks apt-force-ipv4.yaml
  ansible.builtin.include_tasks: apt-force-ipv4.yaml

- name: apt update and apt upgrade
  ansible.builtin.apt:
    upgrade: true
    update_cache: true
    cache_valid_time: 3600

- name: apt install debian_base_apt_packages
  ansible.builtin.apt:
    name: "{{ debian_base_apt_packages }}"
    state: present
