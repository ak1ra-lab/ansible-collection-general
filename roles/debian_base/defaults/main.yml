---
# list[str]: Which types of packages to look for from a given source; either binary deb or source code deb-src.
debian_base_apt_repo_debian_types:
  - deb

# https://www.debian.org/mirror/list.html
# list[str]: apt repo uris and mirrors
debian_base_apt_repo_debian_uris:
  # - http://mirrors.tencentyun.com/debian/
  # - https://mirrors.tencent.com/debian/
  # - https://mirrors.aliyun.com/debian/
  # - https://cdn-aws.deb.debian.org/debian/
  - https://deb.debian.org/debian/

# list[str]: debian repo suites
# https://deb.debian.org/debian/dists/
# bookworm, bookworm-updates, bookworm-backports
debian_base_apt_repo_debian_suites:
  - "{{ ansible_facts['distribution_release'] }}"
  - "{{ ansible_facts['distribution_release'] }}-updates"
# list[str]: debian repo components
debian_base_apt_repo_debian_components:
  - main
  - contrib
  - non-free
  - non-free-firmware

# list[str]: Which types of packages to look for from a given source; either binary deb or source code deb-src.
debian_base_apt_repo_debian_security_types:
  - deb

# 一般来说, 为了更及时地获得安全更新, 不推荐使用镜像站安全更新软件源, 因为镜像站往往有同步延迟.
# Encouraging the use of unofficial mirrors would add extra complexity
# that is usually not needed and that can cause frustration if these mirrors are not kept up to date.
# https://www.debian.org/security/faq.en.html#mirror
# list[str]: apt repo uris and mirrors
debian_base_apt_repo_debian_security_uris:
  # - http://mirrors.tencentyun.com/debian-security/
  # - https://mirrors.tencent.com/debian-security/
  # - https://mirrors.aliyun.com/debian-security/
  # - https://cdn-aws.deb.debian.org/debian-security/
  - https://deb.debian.org/debian-security/

# list[str]: debian-security suites
# https://deb.debian.org/debian-security/dists/
# bullseye-security, bookworm-security
debian_base_apt_repo_debian_security_suites:
  - "{{ ansible_facts['distribution_release'] }}-security"
# list[str]: debian-security components
debian_base_apt_repo_debian_security_components:
  - main
  - contrib
  - non-free
  - non-free-firmware

# bool: 是否启用 debian-backports
debian_base_apt_repo_debian_backports_enabled: false
debian_base_apt_repo_debian_backports_preferences_package: "linux-* initramfs-tools"
debian_base_apt_repo_debian_backports_preferences_pin_priority: 500

# The default setup auto-updates packages in the main and security archives,
# which means that only stable and security updates are applied.
# https://github.com/mvo5/unattended-upgrades/blob/b94d28de01504b421f4c06e8a21569cea07890f0/data/50unattended-upgrades.Debian#L29-L34
# bool: 是否启用 ${distro_codename}-updates 自动更新
debian_base_unattended_upgrade_updates_enabled: false
# bool: 是否启用 ${distro_codename}-backports 自动更新
debian_base_unattended_upgrade_backports_enabled: false

# bool: 是否允许 unattended-upgrades 更新后自动重启
debian_base_unattended_upgrade_automatic_reboot_enabled: false
# systemctl cat apt-daily-upgrade.timer
# [Timer]
# OnCalendar=*-*-* 6:00
# RandomizedDelaySec=60m
# Persistent=true
debian_base_unattended_upgrade_automatic_reboot_time: "02:00"

# bool: 强制 apt 使用 IPv4
debian_base_apt_force_ipv4_enabled: true

# str: APT HTTP 代理，例如 http://proxy.example:3128。为空时删除 role 自有的
# apt.conf.d drop-in。
debian_base_apt_http_proxy: ""
# str: APT HTTPS 代理。APT 通常使用 HTTP CONNECT，请填写 http:// 代理地址。
debian_base_apt_https_proxy: ""

# bool: 是否开启 TCP BBR 拥塞控制算法
debian_base_tcp_bbr_enabled: false

# bool: 是否设置 IPv4 ip_forward
debian_base_ip_forward_enabled: false

# bool: 是否在 QEMU/KVM 虚拟机中管理 qemu-guest-agent；非 QEMU/KVM 环境会删除该包
debian_base_qemu_guest_agent_enabled: true

# bool: 是否写入 role 自有的 sshd drop-in
debian_base_custom_sshd_config_enabled: false
# Plain sshd_config lines, rendered in order into the role-owned drop-in.
debian_base_custom_sshd_config_entries: "{{ _debian_base_custom_sshd_config_entries }}"

# bool: 是否设置自定义 sysctl 条目（写入 role 自有的 sysctl.d drop-in）
debian_base_custom_sysctl_conf_enabled: false
debian_base_custom_sysctl_conf_entries: "{{ _debian_base_custom_sysctl_conf_entries }}"

# Baseline packages installed on the host.
debian_base_apt_packages: "{{ _debian_base_apt_packages }}"
