---
# list[str]: Which types of packages to look for from a given source; either binary deb or source code deb-src.
debian_base_apt_repo_debian_types:
  - deb

# https://www.debian.org/mirror/list.html
# list[str]: apt repo uris and mirrors
debian_base_apt_repo_debian_uris:
  # - http://mirrors.tencentyun.com/debian/
  # - https://mirrors.tencent.com/debian/
  # - https://mirrors.aliyun.com/debian/
  # - https://cdn-aws.deb.debian.org/debian/
  - https://deb.debian.org/debian/

# list[str]: debian repo suites
# https://deb.debian.org/debian/dists/
# bookworm, bookworm-updates, bookworm-backports
debian_base_apt_repo_debian_suites:
  - "{{ ansible_facts['distribution_release'] }}"
  - "{{ ansible_facts['distribution_release'] }}-updates"
# list[str]: debian repo components
debian_base_apt_repo_debian_components:
  - main
  - contrib
  - non-free
  - non-free-firmware

# list[str]: Which types of packages to look for from a given source; either binary deb or source code deb-src.
debian_base_apt_repo_debian_security_types:
  - deb

# 一般来说, 为了更及时地获得安全更新, 不推荐使用镜像站安全更新软件源, 因为镜像站往往有同步延迟.
# Encouraging the use of unofficial mirrors would add extra complexity
# that is usually not needed and that can cause frustration if these mirrors are not kept up to date.
# https://www.debian.org/security/faq.en.html#mirror
# list[str]: apt repo uris and mirrors
debian_base_apt_repo_debian_security_uris:
  # - http://mirrors.tencentyun.com/debian-security/
  # - https://mirrors.tencent.com/debian-security/
  # - https://mirrors.aliyun.com/debian-security/
  # - https://cdn-aws.deb.debian.org/debian-security/
  - https://deb.debian.org/debian-security/

# list[str]: debian-security suites
# https://deb.debian.org/debian-security/dists/
# bullseye-security, bookworm-security
debian_base_apt_repo_debian_security_suites:
  - "{{ ansible_facts['distribution_release'] }}-security"
# list[str]: debian-security components
debian_base_apt_repo_debian_security_components:
  - main
  - contrib
  - non-free
  - non-free-firmware

# bool: 是否启用 debian-backports
debian_base_apt_repo_debian_backports_enabled: false
debian_base_apt_repo_debian_backports_preferences_package: "linux-* initramfs-tools"
debian_base_apt_repo_debian_backports_preferences_pin_priority: 500

# The default setup auto-updates packages in the main and security archives,
# which means that only stable and security updates are applied.
# https://github.com/mvo5/unattended-upgrades/blob/b94d28de01504b421f4c06e8a21569cea07890f0/data/50unattended-upgrades.Debian#L29-L34
# bool: 是否启用 ${distro_codename}-updates 自动更新
debian_base_unattended_upgrade_updates_enabled: false
# bool: 是否启用 ${distro_codename}-backports 自动更新
debian_base_unattended_upgrade_backports_enabled: false

# bool: 是否允许 unattended-upgrades 更新后自动重启
debian_base_unattended_upgrade_automatic_reboot_enabled: false
# systemctl cat apt-daily-upgrade.timer
# [Timer]
# OnCalendar=*-*-* 6:00
# RandomizedDelaySec=60m
# Persistent=true
debian_base_unattended_upgrade_automatic_reboot_time: "02:00"

# bool: 强制 apt 使用 IPv4
debian_base_apt_force_ipv4_enabled: true

# bool: 是否开启 TCP BBR 拥塞控制算法
debian_base_tcp_bbr_enabled: false

# bool: 是否设置 IPv4 ip_forward
debian_base_ip_forward_enabled: false

# bool: 是否安装 qemu-guest-agent
debian_base_qemu_guest_agent_enabled: true

# bool: 是否设置自定义 /etc/ssh/sshd_config
debian_base_custom_sshd_config_enabled: false
debian_base_custom_sshd_config_entries:
  ## Specifies whether root can log in using ssh(1).
  ## The argument must be yes, prohibit-password, forced-commands-only, or no. The default is prohibit-password.
  - regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin prohibit-password"
  ## Specifies whether password authentication is allowed. The default is yes.
  - regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  ## Specifies whether TCP forwarding is permitted. The default is yes.
  ## vscode: remote.SSH extension makes use of an SSH tunnel to facilitate communication with the host.
  - regexp: "^#?AllowTcpForwarding"
    line: "AllowTcpForwarding yes"
  ## Specifies whether forwarding Unix domain sockets is permitted. The default is yes.
  ## vscode: `remote.SSH.remoteServerListenOnSocket` requires this to be yes.
  - regexp: "^#?AllowStreamLocalForwarding"
    line: "AllowStreamLocalForwarding yes"

# bool: 是否设置自定义 sysctl 条目（写入 role 自有的 sysctl.d drop-in）
# 下面是一组可选示例, 不是通用推荐值. 每项都有代价或依赖具体负载;
# 启用前先理解其语义, 并在目标主机上验证. 大多数主机保持 false 即可.
debian_base_custom_sysctl_conf_enabled: false
debian_base_custom_sysctl_conf_entries:
  # ref: https://docs.kernel.org/admin-guide/sysctl/net.html
  # NAPI busy polling: 50 us is the kernel-documented value when enabling
  # this globally.  Requires CONFIG_NET_RX_BUSY_POLL and a supporting NIC;
  # prefer SO_BUSY_POLL on selected sockets.  Increases CPU usage and power.
  - name: net.core.busy_read
    value: "50"
  - name: net.core.busy_poll
    value: "50"

  # Hard limits for SO_SNDBUF/SO_RCVBUF.  Debian 13 default in our test:
  # 212992; raising these does NOT raise the TCP autotuning limits in
  # tcp_wmem/tcp_rmem.
  - name: net.core.wmem_max
    value: 8388608
  - name: net.core.rmem_max
    value: 8388608

  # Per-CPU input queue for packets that arrive faster than NAPI can process.
  # Default 1000; 5000 is a modest increase for bursty/high-packet-rate NICs.
  - name: net.core.netdev_max_backlog
    value: 5000

  # 0x1 = client TFO (default), 0x2 = server TFO.  Server support still needs
  # TCP_FASTOPEN on the listener unless 0x400 is also set.  Some middleboxes
  # blackhole TFO; keep the kernel's blackhole detection in mind.
  - name: net.ipv4.tcp_fastopen
    value: "3"

  # 1 (default) resets cwnd after an idle period per RFC 2861; 0 keeps cwnd
  # and can reduce latency for bursty request/response traffic, at the cost of
  # larger bursts after idle.
  - name: net.ipv4.tcp_slow_start_after_idle
    value: "0"

  # Default 60.  Lower values make the kernel less willing to swap; the right
  # value is workload-dependent (databases often use 10, general servers 30).
  - name: vm.swappiness
    value: "30"

  # Optional TCP buffer tuning: the kernel picks tcp_rmem[2] (up to 32 MiB)
  # and tcp_wmem[2] (up to 4 MiB) from RAM size.  Hardcoding the current
  # defaults is a no-op and can lower the max on large hosts; set these only
  # after measuring a high-bandwidth/long-RTT path, for example:
  # - name: net.ipv4.tcp_rmem
  #   value: "4096 131072 8388608"
  # - name: net.ipv4.tcp_wmem
  #   value: "4096 16384 8388608"

  # vm.dirty_ratio / vm.dirty_background_ratio are workload-specific:
  # raising dirty_ratio increases the dirty page cache and can cause I/O
  # latency spikes and more data at risk on crash.  Leave the kernel defaults
  # (20/10 on our Debian 13 test) unless the workload has been benchmarked.

debian_base_apt_packages:
  - bash-completion
  - bat
  - bc
  - btop
  - bzip2
  - conntrack
  - curl
  - dnsutils
  - dos2unix
  - file
  - gawk
  - git
  - git-lfs
  - gnupg2
  - htop
  - iftop
  - iotop
  - iperf3
  - jq
  - less
  - logrotate
  - mtr
  - ncdu
  - nfs-common
  - p7zip
  - p7zip-full
  - parallel
  - parted
  - pipx
  - plocate
  - pv
  - python3
  - python3-pip
  - rename
  - ripgrep
  - rsync
  - screen
  - shellcheck
  - shfmt
  - stow
  - systemd-cron
  - systemd-oomd
  - telnet
  - tmux
  - tree
  - unattended-upgrades
  - vim
  - xxd
