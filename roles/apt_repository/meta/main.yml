  platforms:
    - name: Debian
      versions:
        - trixie
        - bookworm
    - name: Ubuntu
      versions:
        - resolute
        - noble
        - jammy

  galaxy_tags:
    - debian
    - ubuntu
    - apt
    - repository
    - packaging

dependencies: []

allow_duplicates: false
