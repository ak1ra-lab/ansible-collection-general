---
# Role-internal constants. Public knobs live in defaults/main.yml.

# ansible_facts['architecture'] returns x86_64, while dpkg uses amd64.
# Keep the matching default in meta/argument_specs.yml in sync for docs.
_apt_repository_dpkg_architectures:
  x86_64: amd64
  i386: i386
  i686: i386
  aarch64: arm64
  armv7l: armhf
  armv6l: armel
  ppc64le: ppc64el
  s390x: s390x
  riscv64: riscv64

# Role-owned file paths. Callers can override the matching defaults.
_apt_repository_pinning_file: "/etc/apt/preferences.d/90{{ apt_repository_name }}"
_apt_repository_unattended_upgrades_file: "/etc/apt/apt.conf.d/90unattended-upgrades-{{ apt_repository_name }}"
_apt_repository_legacy_list_file: "/etc/apt/sources.list.d/{{ apt_repository_name }}.list"

# Supported keys for the public dictionaries.
_apt_repository_keyring_options:
  - dest
  - url
  - content
  - content_base64
  - deb
  - member
  - checksum
  - force
  - mode
  - owner
  - group
_apt_repository_unattended_upgrades_options:
  - origins_patterns
