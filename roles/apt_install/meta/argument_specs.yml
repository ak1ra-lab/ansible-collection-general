argument_specs:
  main:
    short_description: Manage a third-party APT repository and install its packages
    description:
      - Manage an APT keyring and a DEB822 source file, with optional pinning,
        unattended-upgrades policy, package installation, and cleanup of a
        legacy .list file.
      - Targets Debian 12/13 only.
    options:
      apt_install_repo:
        description: Repository name. Used as the basename of the DEB822 file, the pinning file, the unattended-upgrades file,
          and the legacy .list file to remove.
        type: str
        required: true
      apt_install_repo_enabled:
        description: Tells APT whether the source is enabled or not.
        type: bool
        default: true
        required: false
      apt_install_repo_types:
        description: Which types of packages to look for from a given source; either binary deb or source code deb-src.
        type: list
        default:
          - deb
        required: false
        elements: str
        choices:
          - deb
          - deb-src
      apt_install_repo_uris:
        description: APT repository URIs. A string or a list of strings; at least one URI is required.
        type: raw
        required: true
      apt_install_repo_suites:
        description: APT suites (for example the Debian release name, bookworm-updates, or *).
        type: raw
        default:
          - '{{ ansible_facts[''distribution_release''] }}'
        required: false
      apt_install_repo_components:
        description: APT components (for example main, contrib, non-free, non-free-firmware).
        type: raw
        default:
          - main
        required: false
      apt_install_keyrings_url:
        description: Exactly one of [apt_install_keyrings_url, apt_install_keyrings_file, apt_install_keyrings_content,
          apt_install_keyrings_package] should be set.
        type: str
        default: ''
        required: false
      apt_install_keyrings_file:
        description: Controller-local keyring file to deploy. Exactly one of apt_install_keyrings_url, apt_install_keyrings_file,
          apt_install_keyrings_content, and apt_install_keyrings_package should be set.
        type: str
        default: ''
        required: false
      apt_install_keyrings_content:
        description: Inline keyring contents. Exactly one of apt_install_keyrings_url, apt_install_keyrings_file,
          apt_install_keyrings_content, and apt_install_keyrings_package should be set.
        type: str
        default: ''
        required: false
      apt_install_keyrings_package:
        description: Keyring .deb package downloaded and installed. Exactly one of apt_install_keyrings_url,
          apt_install_keyrings_file, apt_install_keyrings_content, and apt_install_keyrings_package should be set.
        type: str
        default: ''
        required: false
      apt_install_keyrings_package_checksum:
        description: Optional checksum for apt_install_keyrings_package, in the ansible.builtin.get_url format.
        type: str
        default: ''
        required: false
      apt_install_keyrings_dest:
        description: Destination path for the keyring file. Use an .asc suffix for armored keys and .gpg for binary keys.
        type: str
        required: true
      apt_install_pinning:
        description: Write an APT preferences file that pins packages from this repository.
        type: bool
        default: true
        required: false
      apt_install_pinning_package:
        description: Package glob pinned by the APT preferences file.
        type: str
        default: '*'
        required: false
      apt_install_pinning_pin_release:
        description: 'Pin: release line. When empty, the role pins by origin using the first repository URI hostname.'
        type: str
        default: ''
        required: false
      apt_install_pinning_pin_priority:
        description: APT pin priority written to the preferences file.
        type: int
        default: 900
        required: false
      apt_install_unattended_upgrade:
        description: Write an unattended-upgrades origins pattern for this repository.
        type: bool
        default: true
        required: false
      apt_install_unattended_upgrade_origins_pattern:
        description: Explicit unattended-upgrades origins pattern. When empty, the role uses the first repository URI hostname.
        type: str
        default: ''
        required: false
      apt_install_mark_hold:
        description: Mark every package in apt_install_repo_packages as held after installation.
        type: bool
        default: false
        required: false
      apt_install_repo_packages:
        description: Packages installed from the new repository.
        type: list
        default: []
        required: false
        elements: str
