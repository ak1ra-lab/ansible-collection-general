---
# roles/acme_dns
#
# Deploy an acme-dns server: a limited DNS server with RESTful HTTP API
# to handle ACME DNS-01 challenges easily and securely.
#
# Architecture:
#   1) Build the acme-dns Go binary on localhost via go_build
#   2) Create a system user, group, and directories on the target host
#   3) Deploy the binary, config template, and systemd unit
#   4) Start and enable the acme-dns service
#
# Required variables (no defaults, must be set by caller):
#   acme_dns_server_ip   - public IPv4 of the acme-dns server
#   acme_dns_zone        - DNS zone served by this acme-dns instance
#   acme_dns_nsname      - nameserver hostname the zone is delegated to
#   acme_dns_nsadmin     - admin email (with @ replaced by .)
#
# acme_dns_api_tls defaults to letsencrypt; set it explicitly when using the
# staging CA or when TLS is terminated by a reverse proxy.

# ── required variables ─────────────────────────────────────────────────────

# public IPv4 of the acme-dns server, used in the rendered A records.
acme_dns_server_ip: ""
# DNS zone apex served by this acme-dns instance, e.g.
# auth.acme-dns.example.com. TXT lookups for _acme-challenge.<zone> are
# answered by this server, and the parent zone must delegate <zone> to
# acme_dns_nsname. A trailing dot is accepted and normalized.
# This is general.domain in acme-dns, not the deprecated [api] api_domain.
acme_dns_zone: ""
# Hostname of the nameserver the zone is delegated to, e.g.
# ns1.acme-dns.example.com. It must resolve to acme_dns_server_ip, but its
# address record belongs in the parent zone (or the zone that owns the name),
# not in acme-dns's own records unless the name is inside acme_dns_zone.
# A trailing dot is accepted and normalized.
acme_dns_nsname: ""
# admin email (with @ replaced by .), e.g. admin.example.com
acme_dns_nsadmin: ""

# ── [general] ────────────────────────────────────────────────────────────────

# DNS listen address.  Use 127.0.0.1:53 to avoid conflicts with systemd-resolved.
acme_dns_listen: "0.0.0.0:53"
# DNS protocol: both, both4, both6, udp, udp4, udp6, tcp, tcp4, tcp6
acme_dns_protocol: "both"
acme_dns_debug: false

# ── [api] ────────────────────────────────────────────────────────────────────

# API listen IP.  Bind to 127.0.0.1 unless a reverse proxy handles TLS termination.
acme_dns_api_ip: "0.0.0.0"
acme_dns_api_port: "6443"
# TLS mode: none, letsencrypt, letsencryptstaging
acme_dns_api_tls: "letsencrypt"
acme_dns_api_acme_cache_dir: "acme"
# Let's Encrypt expiry notification email
acme_dns_api_notification_email: ""
acme_dns_api_disable_registration: false
# CORS AllowOrigins; set to e.g. ["https://example.com"] to restrict
acme_dns_api_corsorigins: []
acme_dns_api_use_header: false
acme_dns_api_header_name: "X-Forwarded-For"

# ── [database] ───────────────────────────────────────────────────────────────

# sqlite or postgres (upstream v2.0+; the old sqlite3 value was removed)
acme_dns_db_engine: "sqlite"
# filename for sqlite, postgres://$user:$pass@$host/$db for postgres
acme_dns_db_connection: "acme-dns.db"

# ── [logconfig] ──────────────────────────────────────────────────────────────

# error, warning, info, debug
acme_dns_loglevel: "info"
# stdout or file
acme_dns_logtype: "stdout"
acme_dns_logfile: "./acme-dns.log"
# json or text
acme_dns_logformat: "json"

# ── system user / group / paths ──────────────────────────────────────────────

# Dedicated service account and group. The default data/config directories use
# the same name as the user; override the paths individually to relocate them.
acme_dns_user: "acme-dns"
acme_dns_group: "acme-dns"
acme_dns_home_dir: "/var/lib/{{ acme_dns_user }}"
acme_dns_config_dir: "/etc/{{ acme_dns_user }}"
acme_dns_install_dir: "/usr/local/bin"

# ── go_build parameters ──────────────────────────────────────────────────────

# The upstream URL, package, static mode, target OS, and systemd service/unit
# names are internal constants in vars/main.yaml.
# Release tag to build; override to test another acme-dns release.
acme_dns_go_build_repo_version: "v2.0.2"
# Target architecture and local build cache on the controller.
acme_dns_go_build_goarch: "amd64"
acme_dns_go_build_base_dir: "/tmp/acme-dns"
