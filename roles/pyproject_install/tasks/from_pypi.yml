---
- name: install package from PyPI or TestPyPI
  ansible.builtin.pip:
    name: >-
      {{ pyproject_install_package_name
         ~ ('[' ~ pyproject_install_package_extras ~ ']'
            if pyproject_install_package_extras else '') }}
    state: "{{ _pyproject_install_pip_state[pyproject_install_source] }}"
    virtualenv: "{{ pyproject_install_venv_dir }}"
    virtualenv_command: "{{ pyproject_install_python_interpreter }} -m venv"
    extra_args: "{{ _pyproject_install_pip_extra_args[pyproject_install_source] }}"
