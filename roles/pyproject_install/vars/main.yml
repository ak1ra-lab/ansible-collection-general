---
# system packages required by ansible.builtin.pip, keyed by ansible_facts.os_family.
# Internal data — callers should override pyproject_install_system_packages directly.
_pyproject_install_system_packages_os_map:
  debian:
    - python3-pip
    - python3-packaging
    - python3-venv
  redhat:
    - python3-pip
    - python3-packaging
  suse:
    - python3-pip
    - python3-packaging
  archlinux:
    - python-pip
    - python-packaging
  alpine:
    - py3-pip
    - py3-packaging
  default:
    - python3-pip
    - python3-packaging

# pip extra arguments by install source (internal; callers should not override)
_pyproject_install_pip_extra_args:
  local: ""
  pypi: ""
  testpypi: >-
    --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/
