---
- name: assert the target platform is supported
  ansible.builtin.assert:
    that:
      - (ansible_facts.get('os_family', '') | lower) == 'debian'
      - (ansible_facts.get('pkg_mgr', '')) == 'apt'
      - >-
        (
          ((ansible_facts.get('distribution', '') | lower) == 'debian') and
          ((ansible_facts.get('distribution_major_version', '0') | int) >= 12)
        ) or (
          ((ansible_facts.get('distribution', '') | lower) == 'ubuntu') and
          ((ansible_facts.get('distribution_major_version', '0') | int) >= 22)
        )
    fail_msg: >-
      roles/docker supports Debian >= 12 and Ubuntu >= 22.04; gather facts
      before applying the role

- name: assert the Docker repository inputs are valid
  ansible.builtin.assert:
    that:
      - (docker_apt_repo | length) > 0
      - (docker_apt_repo_uris | length) > 0
      - (docker_apt_keyrings_url | length) > 0
      - (docker_apt_keyrings_dest | length) > 0
    fail_msg: >-
      docker_apt_repo, docker_apt_repo_uris, docker_apt_keyrings_url, and
      docker_apt_keyrings_dest must be set

- name: assert the Docker APT policy inputs are valid
  ansible.builtin.assert:
    that:
      - >-
        (not (docker_apt_pinning | ansible.builtin.bool)) or
        ((docker_apt_pinning_pin_release | length) > 0)
      - >-
        (not (docker_apt_unattended_upgrade | ansible.builtin.bool)) or
        ((docker_apt_unattended_upgrade_origins_pattern | length) > 0)
    fail_msg: >-
      docker_apt_pinning_pin_release is required when docker_apt_pinning is
      true, and docker_apt_unattended_upgrade_origins_pattern is required when
      docker_apt_unattended_upgrade is true

- name: assert the Docker daemon proxy keys are valid
  when: (docker_daemon_proxies | length) > 0
  ansible.builtin.assert:
    that:
      - >-
        (docker_daemon_proxies.keys() | list | difference(
          ['http-proxy', 'https-proxy', 'no-proxy']
        ) | length) == 0
    fail_msg: >-
      docker_daemon_proxies supports http-proxy, https-proxy, and no-proxy

- name: configure the Docker APT repository
  ansible.builtin.import_role:
    name: ak1ra_lab.general.apt_repository
  vars:
    apt_repository_name: "{{ docker_apt_repo }}"
    apt_repository_uris: "{{ docker_apt_repo_uris | list }}"
    apt_repository_suites:
      - "{{ docker_apt_repo_suites }}"
    apt_repository_components:
      - "{{ docker_apt_repo_components }}"
    apt_repository_keyring:
      url: "{{ docker_apt_keyrings_url }}"
      dest: "{{ docker_apt_keyrings_dest }}"
      checksum: "{{ docker_apt_keyrings_checksum }}"
      force: "{{ docker_apt_keyrings_force | ansible.builtin.bool }}"
    apt_repository_download_proxy: "{{ docker_apt_keyrings_proxy }}"
    apt_repository_download_no_proxy: "{{ docker_apt_keyrings_no_proxy }}"
    apt_repository_pinning: "{{ _docker_apt_pinning }}"
    apt_repository_unattended_upgrades: "{{ _docker_apt_unattended_upgrades }}"

- name: install the Docker packages
  when:
    - (docker_apt_repo_packages | length) > 0
  ansible.builtin.apt:
    name: "{{ docker_apt_repo_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: hold the Docker packages
  when:
    - (docker_apt_repo_packages | length) > 0
    - (docker_apt_mark_hold | ansible.builtin.bool)
  ansible.builtin.dpkg_selections:
    name: "{{ package }}"
    selection: hold
  loop: "{{ docker_apt_repo_packages }}"
  loop_control:
    loop_var: package
    label: "{{ package }}"

- name: ensure /etc/docker directory exist
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: add /etc/docker/daemon.json
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: systemctl restart docker.service

- name: register ansible regular user
  ansible.builtin.command:
    cmd: "awk -F: '$NF !~ /nologin|false/ && $3 >= 1000 {print $1}' /etc/passwd"
  register: docker_regular_users
  changed_when: false

- name: append 'docker' groups
  ansible.builtin.user:
    name: "{{ user | trim }}"
    groups:
      - docker
    append: true
  loop: "{{ docker_regular_users.stdout_lines }}"
  loop_control:
    loop_var: user

- name: ensure docker.service are started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
