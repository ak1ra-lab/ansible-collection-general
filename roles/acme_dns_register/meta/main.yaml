---
# Role metadata for acme_dns_register

galaxy_info:
  author: ak1ra
  description: >-
    Register one acme-dns account per validation domain and optionally add the
    required _acme-challenge CNAME records so that TLS certificates can be
    obtained via DNS-01 challenge without storing DNS provider credentials on
    the remote host.
  license: MIT
  min_ansible_version: "2.18"

  platforms:
    - name: Ubuntu
      versions:
        - noble
        - jammy
    - name: Debian
      versions:
        - trixie
        - bookworm

  galaxy_tags:
    - acme
    - dns
    - tls

dependencies: []

allow_duplicates: false
