---
# Default variables for the acme_dns_register role.
#
# The role registers one acme-dns account per validation domain.  A
# validation domain is the ACME identifier with any leading "*." removed:
# example.com and *.example.com share one account, while www.example.com
# gets its own account.

# ── acme-dns server ──────────────────────────────────────────────────────────

# URL of the acme-dns server to register with (required when registering or
# when accounts are supplied).
# e.g. "https://auth.acme-dns.io" or "https://auth.acme-dns.example.com:6443".
acme_dns_register_server_url: ""

# Existing accounts, keyed by validation domain:
#   example.com:
#     username: ...
#     password: ...
#     subdomain: ...
#     fulldomain: ...
# Missing domains are registered on the next run; existing entries are reused.
acme_dns_register_accounts: {}

# ── Cloudflare CNAME automation ──────────────────────────────────────────────

# Cloudflare account-level API token (optional; least-privilege alternative:
# use acme_dns_register_cloudflare_zone_token instead).
acme_dns_register_cloudflare_api_token: ""

# Cloudflare zone-scoped API token (preferred over the account token).
acme_dns_register_cloudflare_zone_token: ""

# Global Cloudflare DNS zone fallback (e.g. "example.com").  When empty, the
# zone is derived from each validation domain's last two labels.
acme_dns_register_cloudflare_zone: ""

# Per-validation-domain Cloudflare zone overrides.  Useful when domains span
# zones or when the last-two-labels heuristic is wrong:
#   foo.example.co.uk: example.co.uk
acme_dns_register_cloudflare_zones: {}

# ── Manual CNAME fallback ────────────────────────────────────────────────────

# When no Cloudflare token is available, pause after a fresh registration so
# the operator can add the CNAME records.  Set to false for non-interactive
# runs that manage CNAMEs elsewhere.
acme_dns_register_manual_prompt: true

# ── Domain and credential context ────────────────────────────────────────────

# ACME identifiers for which accounts and _acme-challenge CNAME records are
# required.  Wildcards are normalized to their base validation domain.
acme_dns_register_acme_domains: []

# Directory where acme-dns accounts are persisted (on the Ansible controller).
# Default: {{ playbook_dir }}/host_vars/{{ inventory_hostname }}
# The file is always named acme_dns_credentials.yaml inside this directory.
acme_dns_register_credentials_dir: ""
