---
- name: normalize the acme-dns validation domains
  ansible.builtin.set_fact:
    _acme_dns_register_domains: >-
      {{ acme_dns_register_acme_domains
         | map('ansible.builtin.regex_replace', '^\*\.', '')
         | map('lower') | ansible.builtin.unique | list }}

- name: determine which domains need an acme-dns account
  ansible.builtin.set_fact:
    _acme_dns_register_missing_domains: >-
      {{ _acme_dns_register_domains
         | ansible.builtin.difference(_acme_dns_register_accounts.keys() | list) }}

- name: initialize the newly registered domain list
  ansible.builtin.set_fact:
    acme_dns_register_new_domains: []

- name: register the missing acme-dns accounts
  when: _acme_dns_register_missing_domains | length > 0
  no_log: true
  ansible.builtin.uri:
    url: "{{ _acme_dns_register_server_url }}/register"
    method: POST
    return_content: true
    status_code: 201
  register: _acme_dns_register_response
  loop: "{{ _acme_dns_register_missing_domains }}"
  loop_control:
    label: "{{ item }}"

- name: add the registered accounts to the registry
  when: _acme_dns_register_missing_domains | length > 0
  no_log: true
  ansible.builtin.set_fact:
    _acme_dns_register_accounts: >-
      {{ _acme_dns_register_accounts | ansible.builtin.combine({item.item: {
           'username': item.json.username,
           'password': item.json.password,
           'subdomain': item.json.subdomain,
           'fulldomain': item.json.fulldomain
         }}) }}
    acme_dns_register_new_domains: >-
      {{ _acme_dns_register_response.results | map(attribute='item') | list }}
  loop: "{{ _acme_dns_register_response.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: validate the registered accounts
  when: _acme_dns_register_missing_domains | length > 0
  ansible.builtin.assert:
    that:
      - acme_dns_register_new_domains | length == _acme_dns_register_missing_domains | length
      - >-
        _acme_dns_register_missing_domains
        | ansible.builtin.difference(_acme_dns_register_accounts.keys() | list) | length == 0
    fail_msg: >-
      the acme-dns server did not return complete credentials for every
      requested validation domain.
    quiet: true

- name: publish the effective registry and registration summary
  no_log: true
  ansible.builtin.set_fact:
    acme_dns_register_effective_server_url: "{{ _acme_dns_register_server_url }}"
    acme_dns_register_effective_accounts: "{{ _acme_dns_register_accounts }}"
    # Keep the input-named facts for callers that pass values as play vars.
    # Role parameters shadow these facts, so include_role callers should use
    # the effective_* facts above.
    acme_dns_register_server_url: "{{ _acme_dns_register_server_url }}"
    acme_dns_register_accounts: "{{ _acme_dns_register_accounts }}"
    acme_dns_register_newly_registered: "{{ acme_dns_register_new_domains | length > 0 }}"

- name: ensure the credentials output directory exists
  become: false
  delegate_to: localhost
  ansible.builtin.file:
    path: "{{ _acme_dns_register_output_dir }}"
    state: directory
    mode: "0700"

- name: write the acme-dns account registry
  become: false
  delegate_to: localhost
  no_log: true
  ansible.builtin.copy:
    content: >-
      {{
        {
          'acme_dns_register_server_url': _acme_dns_register_server_url,
          'acme_dns_register_accounts': _acme_dns_register_accounts
        } | ansible.builtin.to_nice_yaml(indent=2, sort_keys=true)
      }}
    dest: "{{ _acme_dns_register_output_dir }}/acme_dns_credentials.yaml"
    mode: "0600"

- name: initialize the CNAME list
  ansible.builtin.set_fact:
    _acme_dns_register_cnames: []

- name: build the CNAME records
  ansible.builtin.set_fact:
    _acme_dns_register_cnames: >-
      {{ _acme_dns_register_cnames
         + [{'domain': item,
             'name': '_acme-challenge.' ~ item,
             'target': _acme_dns_register_accounts[item].fulldomain}] }}
  loop: "{{ _acme_dns_register_domains }}"
  loop_control:
    label: "{{ item }}"
