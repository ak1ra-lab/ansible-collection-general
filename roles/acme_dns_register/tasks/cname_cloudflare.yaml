---
# Ensure one _acme-challenge CNAME per validation domain, pointing at that
# domain's own acme-dns fulldomain.
# All tasks run on the Ansible controller.

- name: derive the Cloudflare API token
  become: false
  delegate_to: localhost
  ansible.builtin.set_fact:
    # Prefer the zone-scoped token (least-privilege); fall back to the account token.
    _acme_dns_register_cf_api_token: >-
      {{ acme_dns_register_cloudflare_zone_token
         if acme_dns_register_cloudflare_zone_token | length > 0
         else acme_dns_register_cloudflare_api_token }}

- name: initialize the Cloudflare CNAME list
  become: false
  delegate_to: localhost
  ansible.builtin.set_fact:
    _acme_dns_register_cloudflare_records: []

- name: derive the Cloudflare zones and record names
  become: false
  delegate_to: localhost
  ansible.builtin.set_fact:
    _acme_dns_register_cloudflare_records: >-
      {% set zone = acme_dns_register_cloudflare_zones[item.domain]
                    | default(acme_dns_register_cloudflare_zone, true)
                    or (item.domain.split('.')[-2:] | join('.')) %}
      {{ _acme_dns_register_cloudflare_records
         + [{'domain': item.domain,
             'zone': zone,
             'record': item.name | ansible.builtin.regex_replace('\.' + zone + '$', ''),
             'target': item.target}] }}
  loop: "{{ _acme_dns_register_cnames }}"
  loop_control:
    label: "{{ item.domain }}"

- name: validate the Cloudflare zones
  become: false
  delegate_to: localhost
  ansible.builtin.assert:
    that:
      - item.zone.split('.') | length >= 2
      - item.record | length > 0
    fail_msg: >-
      cannot derive a Cloudflare zone for {{ item.domain }}; set
      acme_dns_register_cloudflare_zones or
      acme_dns_register_cloudflare_zone.
    quiet: true
  loop: "{{ _acme_dns_register_cloudflare_records }}"
  loop_control:
    label: "{{ item.domain }}"

- name: add the _acme-challenge CNAME records
  become: false
  delegate_to: localhost
  community.general.cloudflare_dns:
    api_token: "{{ _acme_dns_register_cf_api_token }}"
    zone: "{{ item.zone }}"
    record: "{{ item.record }}"
    type: CNAME
    value: "{{ item.target }}"
    proxied: false
    state: present
  loop: "{{ _acme_dns_register_cloudflare_records }}"
  loop_control:
    label: "{{ item.record }} -> {{ item.target }}"

- name: display the CNAME summary
  become: false
  delegate_to: localhost
  ansible.builtin.debug:
    msg: |-
      Cloudflare CNAME records ensured for {{ inventory_hostname }}:
      {% for item in _acme_dns_register_cnames %}
        {{ item.name }}.  CNAME  {{ item.target }}.
      {% endfor %}
