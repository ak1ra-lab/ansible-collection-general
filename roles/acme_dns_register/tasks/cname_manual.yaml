---
# Display the CNAME records that must be added when no Cloudflare API token
# is available.  The prompt is optional for non-interactive runs.
# All tasks run on the Ansible controller.

- name: display the required CNAME records
  become: false
  delegate_to: localhost
  ansible.builtin.debug:
    msg: |-
      ============================================================
      ACTION REQUIRED: add the following DNS CNAME record(s) for
      {{ inventory_hostname }} before continuing.

      {% for item in _acme_dns_register_cnames %}
        {{ item.name }}.  CNAME  {{ item.target }}.
      {% endfor %}

      These records delegate the ACME DNS-01 challenge to the
      acme-dns server at {{ acme_dns_register_server_url }}.
      The CNAME only needs to be added once; it never changes.
      ============================================================

- name: wait for the operator to add the CNAME records
  when: acme_dns_register_manual_prompt | ansible.builtin.bool
  become: false
  delegate_to: localhost
  ansible.builtin.pause:
    prompt: >-
      Add the CNAME record(s) shown above using your DNS provider's control
      panel or API, then press Enter to continue.
      (Press Ctrl+C then A to abort.)
