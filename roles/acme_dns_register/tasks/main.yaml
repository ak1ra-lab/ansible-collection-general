---
# acme_dns_register role
#
# Registers with an acme-dns server (POST /register) and persists the resulting
# credentials to a host_vars directory.
#
# If the credentials are already present in host_vars the registration step is
# skipped (idempotent).
#
# When a Cloudflare API token and the acme-dns fulldomain are available, the
# required _acme-challenge CNAME record(s) are reconciled on every run
# (idempotent).  For all other DNS providers the role pauses and prompts the
# operator to add the record(s) manually after a fresh registration.
#
# All tasks run on the Ansible controller (delegate_to: localhost).
#
# Public interface (pass via `vars:` on import_role):
#   acme_dns_register_server_url             - acme-dns server URL (required)
#   acme_dns_register_username               - existing username (omit to register)
#   acme_dns_register_password               - existing password
#   acme_dns_register_subdomain              - existing subdomain
#   acme_dns_register_fulldomain             - existing fulldomain (optional)
#   acme_dns_register_cloudflare_api_token   - CF account token (optional)
#   acme_dns_register_cloudflare_zone_token  - CF zone token (optional, preferred)
#   acme_dns_register_cloudflare_zone        - explicit CF zone (optional)
#   acme_dns_register_hostname               - host FQDN (default: inventory_hostname)
#   acme_dns_register_acme_domains           - list of ACME domains for CNAME records
#   acme_dns_register_credentials_dir        - directory for persisted credentials
#
# Output facts (available to subsequent tasks in the play):
#   acme_dns_register_newly_registered  - true when registration occurred this run
#   acme_dns_register_username          - registered (or pre-existing) username
#   acme_dns_register_password          - registered (or pre-existing) password
#   acme_dns_register_subdomain         - registered (or pre-existing) subdomain
#   acme_dns_register_fulldomain        - acme-dns CNAME target

- name: include_tasks validate.yaml
  ansible.builtin.include_tasks: validate.yaml

- name: include_tasks register.yaml
  ansible.builtin.include_tasks: register.yaml

- name: include_tasks cname_cloudflare.yaml
  when:
    - acme_dns_register_fulldomain | length > 0
    - >-
      acme_dns_register_cloudflare_api_token | length > 0
      or acme_dns_register_cloudflare_zone_token | length > 0
  ansible.builtin.include_tasks: cname_cloudflare.yaml

- name: include_tasks cname_manual.yaml
  when:
    - acme_dns_register_newly_registered | ansible.builtin.bool
    - acme_dns_register_cloudflare_api_token | length == 0
    - acme_dns_register_cloudflare_zone_token | length == 0
  ansible.builtin.include_tasks: cname_manual.yaml
