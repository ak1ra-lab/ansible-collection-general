---
# acme_dns_register role
#
# Registers one acme-dns account per validation domain, persists the
# domain -> account registry to a host_vars directory, and ensures the
# required _acme-challenge CNAME records.
#
# A validation domain is the ACME identifier with any leading "*." removed:
# example.com and *.example.com share one account, while www.example.com gets
# its own account.
#
# Registration runs on the managed host; the registry write and CNAME tasks
# are delegated to the Ansible controller (delegate_to: localhost).
#
# Public interface (pass via `vars:` on import_role):
#   acme_dns_register_server_url             - acme-dns server URL (required)
#   acme_dns_register_accounts               - existing domain -> account mapping
#   acme_dns_register_acme_domains           - ACME identifiers needing accounts
#   acme_dns_register_cloudflare_api_token   - CF account token (optional)
#   acme_dns_register_cloudflare_zone_token  - CF zone token (optional, preferred)
#   acme_dns_register_cloudflare_zone        - global CF zone fallback
#   acme_dns_register_cloudflare_zones       - per-domain CF zone overrides
#   acme_dns_register_manual_prompt          - prompt when no CF token (default true)
#   acme_dns_register_credentials_dir        - directory for persisted accounts
#
# Output facts:
#   acme_dns_register_accounts          - domain -> account mapping
#   acme_dns_register_new_domains       - domains registered during this run
#   acme_dns_register_newly_registered  - true when new_domains is non-empty

- name: load the persisted account registry
  ansible.builtin.import_tasks: load.yaml

- name: validate the role inputs
  ansible.builtin.import_tasks: validate.yaml

- name: register or reuse acme-dns accounts
  ansible.builtin.import_tasks: register.yaml

- name: ensure Cloudflare CNAME records
  when:
    - _acme_dns_register_cnames | length > 0
    - >-
      acme_dns_register_cloudflare_api_token | length > 0
      or acme_dns_register_cloudflare_zone_token | length > 0
  ansible.builtin.import_tasks: cname_cloudflare.yaml

- name: show the CNAME records after a fresh registration
  when:
    - acme_dns_register_new_domains | length > 0
    - acme_dns_register_cloudflare_api_token | length == 0
    - acme_dns_register_cloudflare_zone_token | length == 0
  ansible.builtin.import_tasks: cname_manual.yaml
