---
- name: ensure the renewal hook directory exists
  when: _certbot_deploy_hooks_used | ansible.builtin.bool
  ansible.builtin.file:
    path: "{{ _certbot_config_dir }}/renewal-hooks/deploy"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: render the deploy renewal hook
  when: _certbot_deploy_hooks_used | ansible.builtin.bool
  ansible.builtin.template:
    src: deploy-hooks.sh.j2
    dest: "{{ _certbot_default_deploy_hook }}"
    owner: root
    group: root
    mode: "0755"

- name: remove the deploy renewal hook when no hooks are configured
  when: not (_certbot_deploy_hooks_used | ansible.builtin.bool)
  ansible.builtin.file:
    path: "{{ _certbot_default_deploy_hook }}"
    state: absent

- name: render cli.ini
  when: certbot_manage_cli_ini | ansible.builtin.bool
  ansible.builtin.template:
    src: cli.ini.j2
    dest: "{{ certbot_config_dir }}/cli.ini"
    owner: root
    group: root
    mode: "0644"

- name: render the logrotate configuration
  when: certbot_manage_logrotate | ansible.builtin.bool
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/certbot
    owner: root
    group: root
    mode: "0644"

- name: remove configuration files the role no longer manages
  when: >-
    not (certbot_manage_cli_ini | ansible.builtin.bool)
    or not (certbot_manage_logrotate | ansible.builtin.bool)
  block:
    - name: collect the role-managed configuration files
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: _certbot_existing_config
      failed_when: false
      loop:
        - path: "{{ certbot_config_dir }}/cli.ini"
          managed: "{{ certbot_manage_cli_ini | ansible.builtin.bool }}"
        - path: /etc/logrotate.d/certbot
          managed: "{{ certbot_manage_logrotate | ansible.builtin.bool }}"
      loop_control:
        label: "{{ item.path }}"

    - name: remove the role-managed configuration files
      when:
        - not (item.item.managed | ansible.builtin.bool)
        - item.content is defined
        - >-
          'Managed by ak1ra_lab.general.certbot'
          in (item.content | b64decode)
      ansible.builtin.file:
        path: "{{ item.item.path }}"
        state: absent
      loop: "{{ _certbot_existing_config.results }}"
      loop_control:
        label: "{{ item.item.path }}"
