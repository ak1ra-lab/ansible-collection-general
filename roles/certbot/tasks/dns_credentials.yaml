---
- name: ensure the certbot directories exist
  ansible.builtin.file:
    path: "{{ _certbot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ certbot_config_dir }}"
    - "{{ certbot_work_dir }}"
    - "{{ certbot_log_dir }}"
  loop_control:
    loop_var: _certbot_dir
    label: "{{ _certbot_dir }}"

- name: ensure the DNS credentials directory exists
  when:
    - certbot_challenge == 'dns-01'
    - certbot_dns_provider | length > 0
    - certbot_dns_provider != 'acmedns'
  ansible.builtin.file:
    path: "{{ certbot_dns_credentials_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: render the DNS plugin credentials
  when:
    - certbot_challenge == 'dns-01'
    - certbot_dns_provider | length > 0
    - certbot_dns_provider != 'acmedns'
    - certbot_dns_credentials | length > 0
  no_log: true
  ansible.builtin.template:
    src: credentials.ini.j2
    dest: "{{ certbot_dns_credentials_file }}"
    owner: root
    group: root
    mode: "0600"

- name: remove the DNS plugin credentials when none are configured
  when:
    - certbot_challenge == 'dns-01'
    - certbot_dns_provider | length > 0
    - certbot_dns_provider != 'acmedns'
    - certbot_dns_credentials | length == 0
  ansible.builtin.file:
    path: "{{ certbot_dns_credentials_file }}"
    state: absent

- name: configure the acme-dns credentials and auth hook
  when:
    - certbot_challenge == 'dns-01'
    - certbot_dns_provider == 'acmedns'
  ansible.builtin.include_tasks: acmedns.yaml
