---
- name: ensure the manifest cache directory exists
  ansible.builtin.file:
    path: "{{ cert_manager_manifest_cache_dir }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ cert_manager_delegate_to }}"
  become: false
  run_once: true

- name: download the cert-manager release manifest
  ansible.builtin.get_url:
    url: "{{ cert_manager_manifest_url }}"
    dest: "{{ cert_manager_manifest_cache_dir }}/cert-manager-{{ cert_manager_version }}.yaml"
    checksum: "{{ cert_manager_manifest_checksum | default(omit, true) }}"
    mode: "0644"
    force: false
  delegate_to: "{{ cert_manager_delegate_to }}"
  become: false
  run_once: true

- name: apply the cert-manager release manifest
  kubernetes.core.k8s:
    state: present
    src: "{{ cert_manager_manifest_cache_dir }}/cert-manager-{{ cert_manager_version }}.yaml"
    apply: true
    server_side_apply:
      field_manager: ansible
    kubeconfig: "{{ cert_manager_kubeconfig | default(omit, true) }}"
    context: "{{ cert_manager_context | default(omit, true) }}"
  delegate_to: "{{ cert_manager_delegate_to }}"
  become: false
  run_once: true

- name: wait for the cert-manager webhook to become available
  when: cert_manager_install_wait | ansible.builtin.bool
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ cert_manager_namespace }}"
    name: cert-manager-webhook
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
    kubeconfig: "{{ cert_manager_kubeconfig | default(omit, true) }}"
    context: "{{ cert_manager_context | default(omit, true) }}"
  delegate_to: "{{ cert_manager_delegate_to }}"
  become: false
  run_once: true

- name: wait for the ClusterIssuer CRD to become established
  when: cert_manager_install_wait | ansible.builtin.bool
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusterissuers.cert-manager.io
    kubeconfig: "{{ cert_manager_kubeconfig | default(omit, true) }}"
    context: "{{ cert_manager_context | default(omit, true) }}"
  register: _cert_manager_crd
  until:
    - >-
      _cert_manager_crd.resources | length > 0
      and ((_cert_manager_crd.resources[0].status | default({})).conditions | default([])
           | selectattr('type', 'equalto', 'Established')
           | selectattr('status', 'equalto', 'True')
           | list | length > 0)
  retries: 30
  delay: 5
  delegate_to: "{{ cert_manager_delegate_to }}"
  become: false
  run_once: true
