---
- name: resolve the cert-manager release
  when: cert_manager_install | ansible.builtin.bool
  block:
    - name: query the cert-manager release
      when: cert_manager_manifest_url | length == 0
      ak1ra_lab.general.github_releases_info:
        repo: cert-manager/cert-manager
        release_tag: "{{ cert_manager_version }}"
        asset_name: cert-manager.yaml
        require_digest: false
        token: "{{ cert_manager_github_token }}"
      register: _cert_manager_release
      delegate_to: "{{ cert_manager_delegate_to }}"
      become: false
      run_once: true

    - name: resolve the effective version and manifest source
      ansible.builtin.set_fact:
        _cert_manager_version: >-
          {{- cert_manager_version if cert_manager_version | length > 0
              else (((_cert_manager_release | default({})).release | default({})).tag_name
                    | default('custom', true)) -}}
        _cert_manager_manifest_url: >-
          {{- cert_manager_manifest_url if cert_manager_manifest_url | length > 0
              else ((_cert_manager_release | default({})).download_url | default('', true)) -}}
        _cert_manager_manifest_checksum: >-
          {{- cert_manager_manifest_checksum if cert_manager_manifest_checksum | length > 0
              else (((_cert_manager_release | default({})).download_checksum | default('', true))
                    if cert_manager_manifest_url | length == 0 else '') -}}

    - name: validate the resolved cert-manager release
      ansible.builtin.assert:
        that:
          - _cert_manager_version is string
          - _cert_manager_version | length > 0
          - _cert_manager_manifest_url is string
          - _cert_manager_manifest_url | length > 0
          - >-
            _cert_manager_version == 'custom'
            or _cert_manager_version is ansible.builtin.match('^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$')
        fail_msg: >-
          could not resolve a cert-manager release manifest.  Set
          cert_manager_version and cert_manager_manifest_url explicitly, or
          check GitHub access and rate limits.
        quiet: true

- name: ensure the manifest cache directory exists
  ansible.builtin.file:
    path: "{{ cert_manager_manifest_cache_dir }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ cert_manager_delegate_to }}"
  become: false
  run_once: true

- name: download the cert-manager release manifest
  ansible.builtin.get_url:
    url: "{{ _cert_manager_manifest_url }}"
    dest: "{{ cert_manager_manifest_cache_dir }}/cert-manager-{{ _cert_manager_version }}.yaml"
    checksum: "{{ _cert_manager_manifest_checksum | default(omit, true) }}"
    mode: "0644"
    force: false
  delegate_to: "{{ cert_manager_delegate_to }}"
  become: false
  run_once: true

- name: apply the cert-manager release manifest
  kubernetes.core.k8s:
    state: present
    src: "{{ cert_manager_manifest_cache_dir }}/cert-manager-{{ _cert_manager_version }}.yaml"
    apply: true
    server_side_apply:
      field_manager: ansible
    kubeconfig: "{{ cert_manager_kubeconfig | default(omit, true) }}"
    context: "{{ cert_manager_context | default(omit, true) }}"
  delegate_to: "{{ cert_manager_delegate_to }}"
  become: false
  run_once: true

- name: wait for the cert-manager webhook to become available
  when: cert_manager_install_wait | ansible.builtin.bool
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ cert_manager_namespace }}"
    name: cert-manager-webhook
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
    kubeconfig: "{{ cert_manager_kubeconfig | default(omit, true) }}"
    context: "{{ cert_manager_context | default(omit, true) }}"
  delegate_to: "{{ cert_manager_delegate_to }}"
  become: false
  run_once: true

- name: wait for the ClusterIssuer CRD to become established
  when: cert_manager_install_wait | ansible.builtin.bool
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusterissuers.cert-manager.io
    kubeconfig: "{{ cert_manager_kubeconfig | default(omit, true) }}"
    context: "{{ cert_manager_context | default(omit, true) }}"
  register: _cert_manager_crd
  until:
    - >-
      _cert_manager_crd.resources | length > 0
      and ((_cert_manager_crd.resources[0].status | default({})).conditions | default([])
           | selectattr('type', 'equalto', 'Established')
           | selectattr('status', 'equalto', 'True')
           | list | length > 0)
  retries: 30
  delay: 5
  delegate_to: "{{ cert_manager_delegate_to }}"
  become: false
  run_once: true
