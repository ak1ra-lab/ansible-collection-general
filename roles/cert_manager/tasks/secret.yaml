---
- name: build the managed secret
  no_log: true
  ansible.builtin.set_fact:
    _cert_manager_manifest: >-
      {{ lookup('ansible.builtin.template', 'secret.yaml.j2')
         | ansible.builtin.from_yaml }}
    _cert_manager_manifest_filename: "secret-{{ secret.name }}.yaml"

- name: render and apply the managed secret
  ansible.builtin.include_tasks: manifest.yaml
