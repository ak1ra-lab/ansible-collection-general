---
- name: validate the installation settings
  when: cert_manager_install | ansible.builtin.bool
  ansible.builtin.assert:
    that:
      - cert_manager_version is string
      - >-
        cert_manager_version | length == 0
        or cert_manager_version is ansible.builtin.match('^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$')
      - cert_manager_manifest_url is string
      - cert_manager_manifest_checksum is string
      - cert_manager_github_token is string
      - cert_manager_manifest_cache_dir | length > 0
    fail_msg: >-
      cert_manager_install requires cert_manager_version to be empty (latest)
      or a version such as v1.21.2, plus a cache directory for the release
      manifest.
    quiet: true

- name: validate the common settings
  ansible.builtin.assert:
    that:
      - cert_manager_delegate_to | length > 0
      - cert_manager_cluster_issuers is sequence
      - cert_manager_cluster_issuers is not string
      - >-
        cert_manager_manifest_dir | length == 0
        or cert_manager_manifest_dir is ansible.builtin.match('^/')
    fail_msg: >-
      cert_manager_delegate_to is required, cert_manager_cluster_issuers must
      be a list, and cert_manager_manifest_dir must be an absolute path.
    quiet: true

# Loop over indexes instead of the issuer dictionaries so verbose output never
# prints solver credentials or EAB HMAC keys.  The label still shows the name.
- name: build the ClusterIssuer indexes
  ansible.builtin.set_fact:
    _cert_manager_issuer_indexes: "{{ range(0, cert_manager_cluster_issuers | length) | list }}"

- name: validate the ClusterIssuer entry type
  when: cert_manager_cluster_issuers | length > 0
  ansible.builtin.assert:
    that:
      - issuer is mapping
    fail_msg: >-
      cert_manager_cluster_issuers[{{ issuer_index }}] must be a mapping.
    quiet: true
  loop: "{{ _cert_manager_issuer_indexes }}"
  loop_control:
    loop_var: issuer_index
    label: "{{ issuer_index }}"
  vars:
    issuer: "{{ cert_manager_cluster_issuers[issuer_index] }}"

- name: validate the basic ClusterIssuer definitions
  when: cert_manager_cluster_issuers | length > 0
  ansible.builtin.assert:
    that:
      - issuer.name is defined
      - issuer.name is string
      - issuer.name | length > 0
      - issuer.name | length <= 63
      - issuer.server is defined
      - issuer.server is string
      - issuer.server is ansible.builtin.match('^https://')
      - issuer.solver is defined
      - issuer.solver is mapping
      - issuer.solver.cloudflare is not defined or issuer.solver.cloudflare is mapping
      - issuer.solver.http01 is not defined or issuer.solver.http01 is mapping
      - issuer.eab is not defined or issuer.eab is mapping
      - issuer.email is not defined or issuer.email is string
      - issuer.email | default(cert_manager_acme_email, true) | length > 0
      - issuer.profile is not defined or issuer.profile is string
      - >-
        issuer.private_key_secret_name is not defined
        or (issuer.private_key_secret_name is string
            and (issuer.private_key_secret_name | length == 0
                 or (issuer.private_key_secret_name | length <= 63
                     and issuer.private_key_secret_name
                         is ansible.builtin.match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'))))
      - >-
        issuer.keys() | list
        | difference(['name', 'server', 'email', 'profile',
                      'private_key_secret_name', 'solver', 'eab']) | length == 0
    fail_msg: >-
      every ClusterIssuer ({{ issuer.name | default('#' ~ issuer_index) }})
      needs a DNS-label name, an https:// ACME server, a solver mapping, and
      an email (issuer.email or cert_manager_acme_email).  Optional profile
      must be a string and private_key_secret_name a DNS-label Secret name.
    quiet: true
  loop: "{{ _cert_manager_issuer_indexes }}"
  loop_control:
    loop_var: issuer_index
    label: "{{ issuer.name | default('#' ~ issuer_index) }}"
  vars:
    issuer: "{{ cert_manager_cluster_issuers[issuer_index] }}"

- name: validate the ClusterIssuer names
  when: cert_manager_cluster_issuers | length > 0
  ansible.builtin.assert:
    that:
      - >-
        cert_manager_cluster_issuers | map(attribute='name')
        | ansible.builtin.unique | list | length
        == cert_manager_cluster_issuers | length
      - >-
        cert_manager_cluster_issuers | map(attribute='name')
        | select('ansible.builtin.match', '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
        | list | length == cert_manager_cluster_issuers | length
    fail_msg: >-
      ClusterIssuer names must be unique DNS labels.
    quiet: true

- name: validate the ClusterIssuer solvers
  when: cert_manager_cluster_issuers | length > 0
  ansible.builtin.assert:
    that:
      - issuer.solver | length == 1
      - issuer.solver.keys() | list | difference(['cloudflare', 'http01']) | length == 0
    fail_msg: >-
      every ClusterIssuer ({{ issuer.name }}) needs exactly one solver:
      cloudflare or http01.
    quiet: true
  loop: "{{ _cert_manager_issuer_indexes }}"
  loop_control:
    loop_var: issuer_index
    label: "{{ issuer.name }}"
  vars:
    issuer: "{{ cert_manager_cluster_issuers[issuer_index] }}"

- name: validate the Cloudflare solver settings
  when:
    - cert_manager_cluster_issuers | length > 0
    - issuer.solver.cloudflare is defined
  ansible.builtin.assert:
    that:
      - issuer.solver.cloudflare.api_token is not defined or issuer.solver.cloudflare.api_token is string
      - issuer.solver.cloudflare.secret_name is not defined or issuer.solver.cloudflare.secret_name is string
      - >-
        issuer.solver.cloudflare.api_token | default('', true) | length > 0
        or issuer.solver.cloudflare.secret_name | default('', true) | length > 0
      - (issuer.solver.cloudflare.dns_zones | default([])) is sequence
      - (issuer.solver.cloudflare.dns_zones | default([])) is not string
      - >-
        issuer.solver.cloudflare.dns_zones | default([])
        | select('string') | list | length
        == issuer.solver.cloudflare.dns_zones | default([]) | length
      - >-
        (issuer.solver.cloudflare.secret_name | default(issuer.name ~ '-cloudflare', true))
        is ansible.builtin.match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - >-
        (issuer.solver.cloudflare.secret_name | default(issuer.name ~ '-cloudflare', true)) | length <= 63
      - >-
        issuer.solver.cloudflare.keys() | list
        | difference(['api_token', 'secret_name', 'dns_zones']) | length == 0
    fail_msg: >-
      the Cloudflare solver for {{ issuer.name }} needs api_token or
      secret_name, dns_zones must be a list of strings, and the Secret name
      must be a DNS label of at most 63 characters.
    quiet: true
  loop: "{{ _cert_manager_issuer_indexes }}"
  loop_control:
    loop_var: issuer_index
    label: "{{ issuer.name }}"
  vars:
    issuer: "{{ cert_manager_cluster_issuers[issuer_index] }}"

- name: validate the HTTP-01 solver settings
  when:
    - cert_manager_cluster_issuers | length > 0
    - issuer.solver.http01 is defined
  ansible.builtin.assert:
    that:
      - issuer.solver.http01.ingress_class is not defined or issuer.solver.http01.ingress_class is string
      - issuer.solver.http01.keys() | list | difference(['ingress_class']) | length == 0
    fail_msg: >-
      the HTTP-01 solver for {{ issuer.name }} supports only the optional
      ingress_class key.
    quiet: true
  loop: "{{ _cert_manager_issuer_indexes }}"
  loop_control:
    loop_var: issuer_index
    label: "{{ issuer.name }}"
  vars:
    issuer: "{{ cert_manager_cluster_issuers[issuer_index] }}"

- name: validate the external account binding settings
  when:
    - cert_manager_cluster_issuers | length > 0
    - issuer.eab is defined
  ansible.builtin.assert:
    that:
      - issuer.eab.key_id is string
      - issuer.eab.key_id | trim | length > 0
      - issuer.eab.hmac_key is not defined or issuer.eab.hmac_key is string
      - issuer.eab.secret_name is not defined or issuer.eab.secret_name is string
      - >-
        issuer.eab.hmac_key | default('', true) | trim | length > 0
        or issuer.eab.secret_name | default('', true) | trim | length > 0
      - >-
        issuer.eab.hmac_key is not defined
        or issuer.eab.hmac_key is not string
        or issuer.eab.hmac_key | trim | length == 0
        or ((issuer.eab.hmac_key | trim | length >= 43)
            and (issuer.eab.hmac_key | trim) is ansible.builtin.match('^[A-Za-z0-9_-]+$'))
      - >-
        (issuer.eab.secret_name | default(issuer.name ~ '-eab', true))
        is ansible.builtin.match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - >-
        (issuer.eab.secret_name | default(issuer.name ~ '-eab', true)) | length <= 63
      - >-
        issuer.eab.keys() | list
        | difference(['key_id', 'hmac_key', 'secret_name']) | length == 0
    fail_msg: >-
      eab for {{ issuer.name }} needs key_id and either hmac_key (the
      CA-provided base64url key, at least 32 bytes / 43 characters for HS256)
      or secret_name; the Secret name must be a DNS label of at most 63
      characters.
    quiet: true
  loop: "{{ _cert_manager_issuer_indexes }}"
  loop_control:
    loop_var: issuer_index
    label: "{{ issuer.name }}"
  vars:
    issuer: "{{ cert_manager_cluster_issuers[issuer_index] }}"

- name: initialize the managed secret list
  ansible.builtin.set_fact:
    _cert_manager_managed_secrets: []

- name: collect the managed Cloudflare secrets
  when: cert_manager_cluster_issuers | length > 0
  no_log: true
  ansible.builtin.set_fact:
    _cert_manager_managed_secrets: >-
      {{ _cert_manager_managed_secrets
         + ([{'name': issuer.solver.cloudflare.secret_name
                       | default(issuer.name ~ '-cloudflare', true),
              'key': 'api-token',
              'value': issuer.solver.cloudflare.api_token}]
            if (issuer.solver.cloudflare is defined
                and issuer.solver.cloudflare.api_token | default('', true) | length > 0)
            else []) }}
  loop: "{{ _cert_manager_issuer_indexes }}"
  loop_control:
    loop_var: issuer_index
    label: "{{ issuer.name }}"
  vars:
    issuer: "{{ cert_manager_cluster_issuers[issuer_index] }}"

- name: collect the managed external account binding secrets
  when: cert_manager_cluster_issuers | length > 0
  no_log: true
  ansible.builtin.set_fact:
    _cert_manager_managed_secrets: >-
      {{ _cert_manager_managed_secrets
         + ([{'name': issuer.eab.secret_name | default(issuer.name ~ '-eab', true),
              'key': 'secret',
              'value': issuer.eab.hmac_key}]
            if (issuer.eab is defined
                and issuer.eab.hmac_key | default('', true) | length > 0)
            else []) }}
  loop: "{{ _cert_manager_issuer_indexes }}"
  loop_control:
    loop_var: issuer_index
    label: "{{ issuer.name }}"
  vars:
    issuer: "{{ cert_manager_cluster_issuers[issuer_index] }}"

- name: initialize the managed secret entry map
  ansible.builtin.set_fact:
    _cert_manager_secret_entries: {}
    _cert_manager_secret_conflict: false

- name: check for conflicting managed secret entries
  no_log: true
  ansible.builtin.set_fact:
    _cert_manager_secret_conflict: >-
      {{ _cert_manager_secret_conflict
         or (_cert_manager_secret_entries[item.name] is defined
             and _cert_manager_secret_entries[item.name] != item) }}
    _cert_manager_secret_entries: >-
      {{ _cert_manager_secret_entries | combine({item.name: item}) }}
  loop: "{{ _cert_manager_managed_secrets }}"
  loop_control:
    label: "{{ item.name }}"

- name: validate that managed secret names do not conflict
  ansible.builtin.assert:
    that:
      - not (_cert_manager_secret_conflict | ansible.builtin.bool)
    fail_msg: >-
      two issuers use the same Secret name with different credentials; give
      each credential a distinct secret_name.
    quiet: true

- name: initialize the account key secret list
  ansible.builtin.set_fact:
    _cert_manager_account_key_names: []

- name: collect the account key secret names
  ansible.builtin.set_fact:
    _cert_manager_account_key_names: >-
      {{ _cert_manager_account_key_names | default([])
         + [issuer.private_key_secret_name
               | default(issuer.name ~ '-account-key', true)] }}
  loop: "{{ _cert_manager_issuer_indexes }}"
  loop_control:
    loop_var: issuer_index
    label: "{{ issuer.name }}"
  vars:
    issuer: "{{ cert_manager_cluster_issuers[issuer_index] }}"

- name: validate that account key and solver secret names do not conflict
  ansible.builtin.assert:
    that:
      - >-
        _cert_manager_managed_secrets | map(attribute='name') | list
        | difference(_cert_manager_account_key_names) | length
        == _cert_manager_managed_secrets | length
    fail_msg: >-
      a private_key_secret_name collides with a managed solver or EAB Secret;
      choose a distinct account key Secret name.
    quiet: true
