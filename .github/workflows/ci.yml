---
# Collection CI: ansible-lint (plus the Python plugin lint/typecheck and docs)
# and the Molecule scenarios.
#
# All Python tooling comes from the uv-managed environment.  Each job syncs
# the dependency groups it needs once and then runs the tools through
# `uv run --no-sync`; do not add pip installs here, declare the tool in
# `pyproject.toml` instead.
#
# The Molecule scenarios run with rootful Podman on the runner (the same
# recipe as ak1ra-lab/docker-systemd): every container runs privileged
# because systemd needs the capabilities.  The runner additionally needs Go
# (the go_build scenario builds on the control node).
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync the lint and docs dependencies
        run: uv sync --locked --no-dev --group lint --group docs
      - name: Install the collection under test and the required collections
        run: |
          mkdir -p .ansible/collections
          # The repository's ansible.cfg points collections_path at
          # ./.ansible/collections; install the collection under test (for
          # the ak1ra_lab.general.* references in playbooks and the modules'
          # self-imports) and the hook requirements there.
          uv run --no-sync ansible-galaxy collection install \
            --force --collections-path .ansible/collections .
          uv run --no-sync ansible-galaxy collection install \
            -r requirements.yaml -p .ansible/collections
      - name: Run ansible-lint
        run: uv run --no-sync ansible-lint
      - name: Run ruff and ty
        run: |
          uv run --no-sync ruff check plugins/
          uv run --no-sync ruff format --check plugins/
          # ty resolves the ansible_collections imports from the
          # project-local collections path installed above.
          uv run --no-sync ty check plugins/
      - name: Lint collection documentation
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: >-
          uv run --no-sync antsibull-docs lint-collection-docs
          --plugin-docs --validate-collection-refs self --skip-rstcheck .
      - name: Check role documentation coverage
        run: uv run --no-sync python scripts/check_docs.py
      - name: Build the documentation site
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --no-sync mkdocs build --strict

  molecule:
    name: Molecule
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync the Molecule dependencies
        run: uv sync --locked --no-dev --group molecule
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # There is no go.mod at the repository root: the go_build scenario
          # creates its fixture module under /tmp during prepare, so the Go
          # module cache has nothing to key on and setup-go's restore step
          # warns that no dependency file was found.
          cache: false
      # The scenarios search the project-local collections path
      # (ANSIBLE_COLLECTIONS_PATH in extensions/molecule/config.yml), and
      # the shared default scenario's create/destroy run before
      # ansible-compat's prerun installs anything. Install the collection
      # under test and the scenario requirements up front.
      - name: Install the collection under test and scenario requirements
        run: |
          mkdir -p .ansible/collections
          uv run --no-sync ansible-galaxy collection install \
            --force --collections-path .ansible/collections .
          uv run --no-sync ansible-galaxy collection install \
            -r requirements.yaml -p .ansible/collections
      # Rootful Podman is required (see the workflow header). Put the
      # uv-managed virtualenv first on PATH so the root shell runs the same
      # Molecule and ansible-core binaries as the unprivileged steps.
      - name: Run the Molecule scenarios
        run: >-
          sudo env "PATH=${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          MOLECULE_GLOB='extensions/molecule/**/molecule.yml'
          molecule test --all
