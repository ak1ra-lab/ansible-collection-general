---
# Collection CI: ansible-lint (plus the Python plugin lint/typecheck) and the
# Molecule scenarios.
#
# The Molecule scenarios run with rootful Podman on the runner (the same
# recipe as ak1ra-lab/docker-systemd): every container runs privileged
# because systemd needs the capabilities.  The runner additionally needs
# Python (Molecule and ansible-core), uv (the pyproject_install scenario
# builds wheels on the control node) and Go (the go_build scenario builds on
# the control node).
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ansible-lint and the required collections
        run: |
          python -m pip install --upgrade pip
          # distlib is required by ansible-galaxy to process the collection
          # manifest in galaxy.yml when installing from source.
          pip install "ansible-lint==26.8.0" distlib
          # The repository's ansible.cfg points collections_path at
          # ./.ansible/collections; install the collection under test (for
          # the ak1ra_lab.general.* references in playbooks and the modules'
          # self-imports) and the hook requirements there.
          mkdir -p .ansible/collections
          ansible-galaxy collection install --force --collections-path .ansible/collections .
          ansible-galaxy collection install -r requirements.yaml -p .ansible/collections
      - name: Run ansible-lint
        run: ansible-lint
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run ruff and ty
        run: |
          uv sync --group lint
          uv run ruff check plugins/
          uv run ruff format --check plugins/
          # ty resolves the ansible_collections imports from the
          # project-local collections path installed above.
          uv run ty check plugins/
      - name: Lint collection documentation
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: >-
          uv run --group lint antsibull-docs lint-collection-docs
          --plugin-docs --validate-collection-refs self --skip-rstcheck .
      - name: Check role documentation coverage
        run: uv run --group docs python scripts/check_docs.py
      - name: Build the documentation site
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --group docs mkdocs build --strict

  molecule:
    name: Molecule
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Molecule
        run: |
          python -m pip install --upgrade pip
          # distlib is required by ansible-galaxy to process the collection
          # manifest in galaxy.yml when installing from source (prerun).
          pip install "molecule==26.8.0" distlib
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # There is no go.mod at the repository root: the go_build scenario
          # creates its fixture module under /tmp during prepare, so the Go
          # module cache has nothing to key on and setup-go's restore step
          # warns that no dependency file was found.
          cache: false
      # The scenarios search the project-local collections path
      # (ANSIBLE_COLLECTIONS_PATH in extensions/molecule/config.yml), and
      # the shared default scenario's create/destroy run before
      # ansible-compat's prerun installs anything. Install the collection
      # under test and the scenario requirements for root up front.
      - name: Install the collection under test and scenario requirements
        run: |
          mkdir -p .ansible/collections
          sudo env "PATH=${PATH}" ansible-galaxy collection install --force --collections-path .ansible/collections .
          sudo env "PATH=${PATH}" ansible-galaxy collection install -r requirements.yaml -p .ansible/collections
      # Rootful Podman is required (see the workflow header). The preserved
      # PATH lets the root shell use the runner's pip-installed molecule and
      # the tool-cache uv/go binaries.
      - name: Run the Molecule scenarios
        run: >-
          sudo env "PATH=${PATH}"
          MOLECULE_GLOB='extensions/molecule/**/molecule.yml'
          molecule test --all
