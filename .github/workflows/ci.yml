---
# Collection CI: lint/typecheck/docs, the tox-ansible sanity and unit matrix,
# the Galaxy build-import gate, and the Molecule scenarios.
#
# Python tooling comes from the uv-managed environment. Each job syncs the
# dependency group it needs once and then runs tools through `uv run --no-sync`
# or tox; do not add pip installs here.
#
# The Molecule job stays separate and deliberately does not use the full
# Python x ansible-core matrix. It runs rootful Podman because systemd needs
# the capabilities, and the runner additionally needs Go for go_build.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - dev
      - reorg/collections-2026-10
  schedule:
    # Weekly devel/milestone coverage (Monday 03:17 UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the lint and docs dependencies
        run: uv sync --locked --no-dev --group lint --group docs
      - name: Install the collection under test and the required collections
        run: |
          mkdir -p .ansible/collections
          uv run --no-sync ansible-galaxy collection install \
            --force --collections-path .ansible/collections .
          uv run --no-sync ansible-galaxy collection install \
            -r requirements.yaml -p .ansible/collections
      - name: Run ansible-lint
        run: uv run --no-sync ansible-lint
      - name: Run ruff
        run: |
          uv run --no-sync ruff check plugins/ tests/
          uv run --no-sync ruff format --check plugins/ tests/
      - name: Run mypy
        run: uv run --no-sync mypy plugins/ tests/
      - name: Lint collection documentation
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: >-
          uv run --no-sync antsibull-docs lint-collection-docs
          --plugin-docs --validate-collection-refs self --skip-rstcheck .
      - name: Check role documentation coverage
        run: uv run --no-sync python scripts/check_docs.py
      - name: Build the documentation site
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --no-sync mkdocs build --strict

  build-import:
    name: Build and import
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the lint dependencies
        run: uv sync --locked --no-dev --group lint
      - name: Build the collection
        run: |
          rm -rf dist
          uv run --no-sync ansible-galaxy collection build --output-path dist
      - name: Verify the collection metadata and tarball contents
        run: |
          uv run --no-sync python - <<'PY'
          import pathlib
          import yaml

          galaxy = yaml.safe_load(pathlib.Path("galaxy.yml").read_text(encoding="utf-8"))
          assert "build_ignore" in galaxy, "galaxy.yml must use build_ignore"
          assert "manifest" not in galaxy, "galaxy.yml must not use the old manifest key"
          assert galaxy["version"] == "0.4.0", galaxy["version"]
          assert galaxy["license"] == ["GPL-3.0-or-later"], galaxy["license"]
          PY
          tarball=$(ls dist/*.tar.gz)
          for required in meta/runtime.yml README.md LICENSE CHANGELOG.md; do
            tar -tzf "$tarball" | grep -qx "$required"
          done
          if tar -tzf "$tarball" | grep -Eq '^(\.agents|\.ansible|\.venv|site|tests/output|playbooks/(host|group)_vars|config)(/|$)'; then
            echo "local/test-only content leaked into the tarball" >&2
            exit 1
          fi
      - name: Run galaxy-importer
        run: |
          rm -rf /tmp/collection-import
          uv run --no-sync python -m galaxy_importer.main \
            --git-clone-path . \
            --output-path /tmp/collection-import \
            --print-result
      - name: Smoke-test a clean install
        run: |
          tmp=$(mktemp -d)
          uv run --no-sync ansible-galaxy collection install --force --no-deps \
            dist/*.tar.gz -p "$tmp/collections"
          ANSIBLE_COLLECTIONS_PATH="$tmp/collections" \
            uv run --no-sync ansible-doc -t module ak1ra_lab.general.cpu_info >/dev/null

  sanity:
    name: Sanity py${{ matrix.python }}-${{ matrix.ansible }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            ansible: "2.19"
          - python: "3.12"
            ansible: "2.20"
          - python: "3.13"
            ansible: "2.21"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the test dependencies
        run: uv sync --locked --no-dev --group test
      - name: Run ansible-test sanity through tox-ansible
        run: >-
          uv run --no-sync tox
          -e sanity-py${{ matrix.python }}-${{ matrix.ansible }}
          --ansible

  unit:
    name: Unit py${{ matrix.python }}-${{ matrix.ansible }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            ansible: "2.19"
          - python: "3.12"
            ansible: "2.20"
          - python: "3.13"
            ansible: "2.21"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the test dependencies
        run: uv sync --locked --no-dev --group test
      - name: Run ansible-test units through tox-ansible
        run: >-
          uv run --no-sync tox
          -e unit-py${{ matrix.python }}-${{ matrix.ansible }}
          --ansible

  devel:
    name: ${{ matrix.test }} py3.13-${{ matrix.ansible }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: [sanity, unit]
        ansible: [devel, milestone]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the test dependencies
        run: uv sync --locked --no-dev --group test
      - name: Run the weekly devel/milestone environment
        run: >-
          uv run --no-sync tox
          -e ${{ matrix.test }}-py3.13-${{ matrix.ansible }}
          --ansible

  molecule:
    name: Molecule
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the Molecule dependencies
        run: uv sync --locked --no-dev --group molecule
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # WP-6 owns Molecule isolation and removing the manual collection
      # install. Until then the shared default scenario lifecycle still reads
      # the project-local collections path.
      - name: Install the collection under test and scenario requirements
        run: |
          mkdir -p .ansible/collections
          uv run --no-sync ansible-galaxy collection install \
            --force --collections-path .ansible/collections .
          uv run --no-sync ansible-galaxy collection install \
            -r requirements.yaml -p .ansible/collections
      - name: Run the Molecule scenarios
        run: >-
          sudo env "PATH=${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          MOLECULE_GLOB='extensions/molecule/**/molecule.yml'
          molecule test --all
