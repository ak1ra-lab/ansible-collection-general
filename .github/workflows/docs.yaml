---
# Build the MkDocs site and publish it to GitHub Pages.
#
# The ansible-collection plugin reads the collection through ansible-doc, so
# the workflow installs the collection under test into the project-local
# collections path before building. Role READMEs are included through Markdown
# snippets, which is why changes under roles/**/README.md trigger a rebuild.
name: Docs

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "hooks/**"
      - "plugins/**"
      - "roles/**/README.md"
      - "scripts/check_docs.py"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "README.md"
      - "mkdocs.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "galaxy.yml"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install docs dependencies
        run: uv sync --locked --group docs
      - name: Install the collection under test
        run: |
          mkdir -p .ansible/collections
          uv run ansible-galaxy collection install \
            --force --collections-path .ansible/collections .
      - name: Check role documentation coverage
        run: uv run python scripts/check_docs.py
      - name: Build the documentation site
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
