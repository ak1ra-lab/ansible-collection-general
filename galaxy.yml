---
namespace: ak1ra_lab
name: general
version: 0.1.0
readme: README.md
authors:
  - ak1ra <ak1ra.komj@gmail.com>
description: Shared Ansible roles for general build and packaging workflows.
license_file: LICENSE
tags:
  - automation
  - build
  - go
  - linux
  - python
  - tools
dependencies: {}
repository: https://github.com/ak1ra-lab/ansible-collection-general
documentation: https://github.com/ak1ra-lab/ansible-collection-general
homepage: https://github.com/ak1ra-lab/ansible-collection-general
issues: https://github.com/ak1ra-lab/ansible-collection-general/issues
# https://setuptools.pypa.io/en/latest/userguide/miscellaneous.html
manifest:
  omit_default_directives: true
  directives:
    - graft docs
    - graft playbooks
    - graft plugins
    - graft roles
    - recursive-exclude playbooks/host_vars *
    - recursive-exclude playbooks/group_vars *
    - recursive-exclude playbooks/scripts *
    - recursive-exclude playbooks/templates *
    - recursive-exclude roles/*/molecule *
    - global-exclude *~ *.py[cod] __pycache__ *.bak *.swp *.tmp *.retry
    - include requirements.yaml LICENSE README.md
