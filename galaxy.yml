---
# See https://docs.ansible.com/ansible/latest/dev_guide/collections_galaxy_meta.html

namespace: ak1ra_lab
name: general
version: 0.4.0
readme: README.md
authors:
  - ak1ra <ak1ra.komj@gmail.com>
description: General-purpose infrastructure roles, modules, and lookup plugins for ak1ra-lab.
license:
  - GPL-3.0-or-later
tags:
  - apt
  - automation
  - build
  - debian
  - docker
  - go
  - linux
  - python
  - secrets
  - tools
dependencies:
  ansible.posix: ">=1.5.4"
  community.general: ">=8.0.0"
repository: https://github.com/ak1ra-lab/ansible-collection-general
documentation: https://ak1ra-lab.github.io/ansible-collection-general/
homepage: https://github.com/ak1ra-lab/ansible-collection-general
issues: https://github.com/ak1ra-lab/ansible-collection-general/issues

# Keep local development state, generated artifacts, and consumer inventory
# out of the Galaxy artifact. `ansible-galaxy collection build` always excludes
# galaxy.yml, .git and Python cache files.
build_ignore:
  - .agents
  - .ansible
  - .ansible-lint
  - .cache
  - .editorconfig
  - .github
  - .gitignore
  - .molecule
  - .mypy_cache
  - .pre-commit-config.yaml
  - .pytest_cache
  - .ruff_cache
  - .tox
  - .venv
  - ansible.cfg
  - config
  - hooks
  - justfile
  - mkdocs.yaml
  - playbooks/group_vars
  - playbooks/host_vars
  - pyproject.toml
  - requirements.yaml
  - ruff.toml
  - scripts
  - site
  - tests/output
  - uv.lock
  - yamlfmt.yaml
  - changelogs/.plugin-cache.yaml
  - "*.tar.gz"
  - collections
