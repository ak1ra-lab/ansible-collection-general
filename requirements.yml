# Runtime collection dependencies for an ansible-builder execution
# environment. Keep in sync with galaxy.yml.
# Test-only collections live in tests/molecule/requirements.yml (Molecule's
# dependency action and tox-ansible/ade both install that file).
collections:
  - name: ansible.posix
    version: ">=1.5.4"
  - name: community.general
    version: ">=8.0.0"
